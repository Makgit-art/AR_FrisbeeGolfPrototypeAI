<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - 3D Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Shrikhand', Georgia, serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Live Camera Video Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 60px 20px;
            pointer-events: none; /* Let touches pass through to Three.js scene */
        }

        /* Make specific UI elements interactive */
        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .banner-text-bg {
            -webkit-text-stroke: 10px #8B5CF6; /* Purple outline */
            color: #8B5CF6;
        }

        /* Center Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 12px 40px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s ease-in-out, transform 0.1s;
        }
        
        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 10px #246B3E; /* Dark green outline */
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            pointer-events: auto;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 8px;
            width: 0%;
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            width: 100%;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0;">
            <div class="text-outline-wrapper text-4xl sm:text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Start Button -->
        <button id="scan-btn" class="scan-button interactive-element" onclick="startGame()">
            <div class="text-outline-wrapper text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Start Game</span>
                <span class="text-outline-fg">Start Game</span>
            </div>
        </button>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1px black; z-index: 150; pointer-events: none; transition: transform 0.5s ease-out, opacity 0.5s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 200; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button onclick="continueGame()" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Simulated Image Scanner UI -->
        <div id="scanner-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">
            <div style="border: 4px dashed #74ED63; width: 220px; height: 220px; border-radius: 16px; position: relative; box-shadow: 0 0 20px rgba(116, 237, 99, 0.3); animation: pulse 2s infinite;">
                <div style="position: absolute; top: -40px; left: 0; width: 100%; text-align: center; color: #74ED63; font-weight: bold; font-family: sans-serif; font-size: 1.2rem; text-shadow: 2px 2px 4px black; -webkit-text-stroke: 1px black;">SCANNING RETICLE...</div>
                <div style="position: absolute; bottom: -40px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 0.9rem; text-shadow: 1px 1px 2px black;">Align scannable image in frame</div>
            </div>
            
            <!-- Reference Image for the User -->
            <div style="position: absolute; bottom: 100px; right: 20px; display: flex; flex-direction: column; align-items: center;">
                <span style="color: white; font-family: sans-serif; font-size: 0.8rem; text-shadow: 1px 1px 2px black; margin-bottom: 5px;">Target Marker</span>
                <img src="Scannable_Reticle.png" alt="Reticle Reference" style="width: 80px; height: 80px; border: 2px solid white; border-radius: 10px; background: rgba(0,0,0,0.5); object-fit: contain;">
            </div>
        </div>

        <style>
            @keyframes pulse {
                0% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
                50% { border-color: rgba(116, 237, 99, 0.3); box-shadow: 0 0 10px rgba(116, 237, 99, 0.1); }
                100% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
            }
        </style>

        <!-- Bottom Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0;">
            <div class="slider-end-mark"></div>
            <div class="slider-track-container mx-1">
                <div class="slider-track-left"></div>
                <div class="slider-track-right"></div>
                <div class="slider-target-line" id="target-line"></div>
            </div>
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isGameActive = false;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        let chargeSpeed = 2; // Pace at which the power increases
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for perfect throw

        let misses = 0;
        let isGameOver = false;

        // Three.js Variables
        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentTarget = null;
        let environmentGroup;

        // 3D Park Diorama Dimensions (matches 8.5" x 11" rectangular grass footprint in meters)
        const DIORAMA_WIDTH_M = 0.2159;  // 8.5 inches
        const DIORAMA_DEPTH_M = 0.2794;  // 11.0 inches

        // 3D Frisbee Variables
        let frisbeeMesh;
        let frisbeeActive = false;
        let frisbeeVelocity = new THREE.Vector3();
        let targetAim = null;

        // Camera Look / Drag Control Variables
        let isDraggingCamera = false;
        let pointerDownPos = { x: 0, y: 0 };
        let lastPointerPos = { x: 0, y: 0 };
        let cameraYaw = 0;
        let cameraPitch = 0;

        let isScanningMarker = false;
        let controls; // Visual-Inertial Tracker

        async function startCameraFeed() {
            const video = document.getElementById('camera-feed');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.warn('Camera feed unavailable or permission denied:', err);
            }
        }

        async function startGame() {
            const button = document.getElementById('scan-btn');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                button.style.opacity = '0';
                button.style.pointerEvents = 'none';
            }, 100);

            // Request Device Orientation Permission for Visual-Inertial Tracking (iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        console.warn('Device orientation permission not granted for visual-inertial tracking.');
                    }
                } catch (error) {
                    console.error('Error requesting device orientation permission:', error);
                }
            }

            await startCameraFeed();

            if (!renderer) {
                initThreeJS();
            }

            isGameActive = true;
            startScanningForReticle();
        }

        function initThreeJS() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = null; // Keep transparent so live camera feed shows through

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
            camera.position.set(0, 1.4, 0); // Eye level
            camera.rotation.order = 'YXZ';

            // Transparent renderer so the live camera feed shows through cleanly (no stencil shader)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting tuned to match the reference shots (bright warm top light + deep foliage undersides)
            const hemiLight = new THREE.HemisphereLight(0xfff5ec, 0x261712, 0.75);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffaf0, 1.35);
            dirLight.position.set(1.8, 4.5, 2.2);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xd8e2ff, 0.35);
            fillLight.position.set(-2.0, 1.5, -2.0);
            scene.add(fillLight);

            environmentGroup = new THREE.Group();
            scene.add(environmentGroup);

            // Initialize Device Orientation Tracking for AR feel
            controls = new THREE.DeviceOrientationControls(camera);

            // Build the 3D Park Environment directly from the reference shots
            buildTargetTemplate();

            // Build High-Detail Blender-Style 3D Frisbee
            buildFrisbeeMesh();

            window.addEventListener('resize', onWindowResize);
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Base lush meadow green
            ctx.fillStyle = '#5c9436';
            ctx.fillRect(0, 0, 256, 256);

            // Mottled light yellow-green and deep forest green blades/tufts
            const palette = ['#7eb84c', '#98cc64', '#427326', '#2e5718', '#b0db7d', '#548731'];
            for (let i = 0; i < 4200; i++) {
                ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const w = 1.5 + Math.random() * 3.5;
                const h = 1.5 + Math.random() * 4.5;
                ctx.fillRect(x, y, w, h);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2.6);
            return tex;
        }

        function createInteriorSkyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Soft sunlit sky gradient fading to warm pale horizon inside the recessed portal
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0.0, '#6aa6d8');
            grad.addColorStop(0.55, '#b6d8f2');
            grad.addColorStop(0.88, '#e8efe6');
            grad.addColorStop(1.0, '#3e4f34');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 128, 256);

            return new THREE.CanvasTexture(canvas);
        }

        function createBranchTube(pointsArr, radiusBottom, radiusTop, material) {
// ... existing code ... -->
            addLeafCluster(treesGroup, canopyClusters);

            // Scale and recess the 3D park deeply inside the portal cavity behind the z = 0 opening
            parkContentGroup.scale.setScalar(0.80);
            parkContentGroup.position.set(0.008, 0.006, -0.185);
            parkContentGroup.traverse((child) => {
                if (child.isMesh) {
                    child.renderOrder = 1; // Render inside the cavity after the occluder and inner walls
                }
            });
            targetTemplateMesh.add(parkContentGroup);

            // 8. Recessed Portal Cavity & Invisible Depth-Occluder Box (Hole-in-the-Wall Depth Illusion)
            // Front opening matches the 8.5" x 11" scannable reticle footprint.
            const portalW = DIORAMA_WIDTH_M;  // 0.2159m front opening width
            const portalH = DIORAMA_DEPTH_M;  // 0.2794m front opening height
            const centerY = portalH / 2;      // 0.1397m vertical center of front opening

            // Recessed interior chamber is slightly wider & taller behind the opening so edges naturally occlude the park
            const chamberW = 0.28;
            const chamberH = 0.36;
            const chamberDepth = 0.34;
            const chamberMinY = -0.025;
            const chamberMaxY = chamberMinY + chamberH;
            const chamberCenterY = (chamberMinY + chamberMaxY) / 2;

            // --- A. Invisible Outer Depth-Occluder Shell (renderOrder = -2) ---
            // Writes to depth buffer without drawing color so everything outside the front opening stays hidden
            const occluderMat = new THREE.MeshBasicMaterial({
                colorWrite: false,
                depthWrite: true,
                side: THREE.FrontSide
            });

            const occluderGroup = new THREE.Group();
            occluderGroup.name = 'occluder-box-group';

            // 5 outward-facing exterior walls sealing the recessed chamber from side, top, bottom, and rear angles
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(chamberW, chamberH), occluderMat);
            backWall.rotation.y = Math.PI;
            backWall.position.set(0, chamberCenterY, -chamberDepth);
            occluderGroup.add(backWall);

            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(chamberDepth, chamberH), occluderMat);
            leftWall.rotation.y = -Math.PI / 2;
            leftWall.position.set(-chamberW / 2, chamberCenterY, -chamberDepth / 2);
            occluderGroup.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(chamberDepth, chamberH), occluderMat);
            rightWall.rotation.y = Math.PI / 2;
            rightWall.position.set(chamberW / 2, chamberCenterY, -chamberDepth / 2);
            occluderGroup.add(rightWall);

            const topWall = new THREE.Mesh(new THREE.PlaneGeometry(chamberW, chamberDepth), occluderMat);
            topWall.rotation.x = -Math.PI / 2;
            topWall.position.set(0, chamberMaxY, -chamberDepth / 2);
            occluderGroup.add(topWall);

            const bottomWall = new THREE.Mesh(new THREE.PlaneGeometry(chamberW, chamberDepth), occluderMat);
            bottomWall.rotation.x = Math.PI / 2;
            bottomWall.position.set(0, chamberMinY, -chamberDepth / 2);
            occluderGroup.add(bottomWall);

            // Front Mask Flange on the z = 0 scannable image plane with the 8.5" x 11" opening cutout
            const outerExtent = 2.0;
            const halfPW = portalW / 2;
            const minPY = 0;
            const maxPY = portalH;

            const flangeShape = new THREE.Shape();
            flangeShape.moveTo(-outerExtent, centerY - outerExtent);
            flangeShape.lineTo(outerExtent, centerY - outerExtent);
            flangeShape.lineTo(outerExtent, centerY + outerExtent);
            flangeShape.lineTo(-outerExtent, centerY + outerExtent);
            flangeShape.closePath();

            const openingHole = new THREE.Path();
            openingHole.moveTo(-halfPW, minPY);
            openingHole.lineTo(-halfPW, maxPY);
            openingHole.lineTo(halfPW, maxPY);
            openingHole.lineTo(halfPW, minPY);
            openingHole.closePath();
            flangeShape.holes.push(openingHole);

            const frontMaskFlange = new THREE.Mesh(new THREE.ShapeGeometry(flangeShape), occluderMat);
            frontMaskFlange.position.set(0, 0, 0);
            occluderGroup.add(frontMaskFlange);

            occluderGroup.traverse((child) => {
                if (child.isMesh) {
                    child.renderOrder = -2;
                }
            });
            targetTemplateMesh.add(occluderGroup);

            // --- B. Recessed Interior Chamber Backdrop & Shadowed Opening Rim (renderOrder = 0) ---
            // Replaces the live camera feed inside the opening with a light blue recessed cavity so the park
            // clearly lives *within* the scannable image rather than floating on top of it.
            const cavityGroup = new THREE.Group();
            cavityGroup.name = 'portal-cavity-group';

            const innerWallMat = new THREE.MeshStandardMaterial({ color: 0xadd8e6, roughness: 0.85, side: THREE.FrontSide });
            const innerCeilingMat = new THREE.MeshStandardMaterial({ color: 0xc2e6f5, roughness: 0.85, side: THREE.FrontSide });
            const innerFloorMat = new THREE.MeshStandardMaterial({ color: 0x96cbe0, roughness: 0.9, side: THREE.FrontSide });
            const rimShadowMat = new THREE.MeshStandardMaterial({ color: 0x181c22, roughness: 0.9, side: THREE.FrontSide });

            // Inward-facing interior light blue walls (slightly inset from the outer occluder walls)
            const innerBack = new THREE.Mesh(new THREE.PlaneGeometry(chamberW, chamberH), innerWallMat);
            innerBack.position.set(0, chamberCenterY, -chamberDepth + 0.002);
            cavityGroup.add(innerBack);

            const innerLeft = new THREE.Mesh(new THREE.PlaneGeometry(chamberDepth, chamberH), innerWallMat);
            innerLeft.rotation.y = Math.PI / 2;
            innerLeft.position.set(-chamberW / 2 + 0.002, chamberCenterY, -chamberDepth / 2);
            cavityGroup.add(innerLeft);

            const innerRight = new THREE.Mesh(new THREE.PlaneGeometry(chamberDepth, chamberH), innerWallMat);
            innerRight.rotation.y = -Math.PI / 2;
            innerRight.position.set(chamberW / 2 - 0.002, chamberCenterY, -chamberDepth / 2);
            cavityGroup.add(innerRight);

            const innerTop = new THREE.Mesh(new THREE.PlaneGeometry(chamberW, chamberDepth), innerCeilingMat);
            innerTop.rotation.x = Math.PI / 2;
            innerTop.position.set(0, chamberMaxY - 0.002, -chamberDepth / 2);
            cavityGroup.add(innerTop);

            const innerBottom = new THREE.Mesh(new THREE.PlaneGeometry(chamberW, chamberDepth), innerFloorMat);
            innerBottom.rotation.x = -Math.PI / 2;
            innerBottom.position.set(0, chamberMinY + 0.002, -chamberDepth / 2);
            cavityGroup.add(innerBottom);

            // Recessed dark entrance collar (2.2cm deep) right inside the z = 0 opening for crisp wall-thickness depth cues
            const collarDepth = 0.022;
            const collarLeft = new THREE.Mesh(new THREE.PlaneGeometry(collarDepth, portalH), rimShadowMat);
            collarLeft.rotation.y = Math.PI / 2;
            collarLeft.position.set(-halfPW, centerY, -collarDepth / 2);
            cavityGroup.add(collarLeft);

            const collarRight = new THREE.Mesh(new THREE.PlaneGeometry(collarDepth, portalH), rimShadowMat);
            collarRight.rotation.y = -Math.PI / 2;
            collarRight.position.set(halfPW, centerY, -collarDepth / 2);
            cavityGroup.add(collarRight);

            const collarTop = new THREE.Mesh(new THREE.PlaneGeometry(portalW, collarDepth), rimShadowMat);
            collarTop.rotation.x = Math.PI / 2;
            collarTop.position.set(0, maxPY, -collarDepth / 2);
            cavityGroup.add(collarTop);

            const collarBottom = new THREE.Mesh(new THREE.PlaneGeometry(portalW, collarDepth), rimShadowMat);
            collarBottom.rotation.x = -Math.PI / 2;
            collarBottom.position.set(0, minPY, -collarDepth / 2);
            cavityGroup.add(collarBottom);

            cavityGroup.traverse((child) => {
                if (child.isMesh) {
                    child.renderOrder = 0;
                }
            });
            targetTemplateMesh.add(cavityGroup);
        }

        function buildFrisbeeMesh() {
// ... existing code ... -->
        function spawnTargetOnReticle() {
            if (!targetTemplateMesh || activeTargets.length >= 1) return;

            // Spawn the 3D park environment recessed inside its occluder box on the scanned reticle ~3 feet away
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const scanPos = camera.position.clone().addScaledVector(forward, 0.9144); // Exactly 3 feet away
            scanPos.y -= DIORAMA_DEPTH_M / 2; // Center the 8.5" x 11" front opening directly on the scanned reticle

            const targetClone = targetTemplateMesh.clone();
            targetClone.position.copy(scanPos);

            // Keep diorama upright (trees vertical) while rotating horizontally to face the player's front view
            const toCamX = camera.position.x - scanPos.x;
            const toCamZ = camera.position.z - scanPos.z;
            targetClone.rotation.set(0, Math.atan2(toCamX, toCamZ), 0);

            targetClone.userData.hitsRemaining = 3;

            scene.add(targetClone);
            activeTargets.push(targetClone);
            currentTarget = targetClone;
        }
// ... existing code ... -->
            // Apply Visual-Inertial Tracking to Camera + Subtle Parallax Shift for Depth Illusion
            if (controls && controls.deviceOrientation && controls.deviceOrientation.alpha !== null) {
                controls.update();
                if (currentTarget) {
                    const lookDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    const toTarget = new THREE.Vector3().subVectors(currentTarget.position, new THREE.Vector3(0, 1.4, 0)).normalize();
