<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - 3D Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Shrikhand', Georgia, serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Live Camera Video Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 36px 20px 56px 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 28px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .banner-text-bg {
            -webkit-text-stroke: 8px #8B5CF6;
            color: #8B5CF6;
        }

        /* Center Start / Continue Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 14px 40px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            opacity: 1;
            position: relative;
            z-index: 300;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.35s ease-in-out, transform 0.1s ease;
        }

        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 8px #246B3E;
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
            box-sizing: border-box;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 10px;
            width: 0%;
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            flex: 1;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            border: 1px solid black;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        @keyframes pulse {
            0% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
            50% { border-color: rgba(116, 237, 99, 0.35); box-shadow: 0 0 10px rgba(116, 237, 99, 0.15); }
            100% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0; pointer-events: none;">
            <div class="text-outline-wrapper text-3xl sm:text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Start Button -->
        <button id="scan-btn" type="button" class="scan-button interactive-element">
            <div class="text-outline-wrapper text-3xl sm:text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Start Game</span>
                <span class="text-outline-fg">Start Game</span>
            </div>
        </button>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; left: 50%; top: 45%; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1.5px black; z-index: 150; pointer-events: none; transition: transform 0.6s ease-out, opacity 0.6s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 250; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button id="continue-btn" type="button" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Simulated Image Scanner UI -->
        <div id="scanner-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">
            <div id="scanner-frame" style="border: 4px dashed #74ED63; width: 220px; height: 220px; border-radius: 16px; position: relative; animation: pulse 2s infinite; pointer-events: auto; cursor: pointer;">
                <div style="position: absolute; top: -40px; left: 0; width: 100%; text-align: center; color: #74ED63; font-weight: bold; font-family: sans-serif; font-size: 1.15rem; text-shadow: 2px 2px 4px black;">SCANNING RETICLE...</div>
                <div style="position: absolute; bottom: -46px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 0.85rem; text-shadow: 1px 1px 2px black;">Align scannable image (or tap frame)</div>
            </div>

            <!-- Reference Image for the User -->
            <div style="position: absolute; bottom: 110px; right: 20px; display: flex; flex-direction: column; align-items: center;">
                <span style="color: white; font-family: sans-serif; font-size: 0.75rem; text-shadow: 1px 1px 2px black; margin-bottom: 5px;">Target Marker</span>
                <img id="reticle-ref-img" src="Scannable_Reticle.png" alt="Reticle Reference" style="width: 76px; height: 76px; border: 2px solid white; border-radius: 10px; background: rgba(255, 255, 255, 0.9); object-fit: contain;" onerror="this.style.display='none'; document.getElementById('reticle-svg-fallback').style.display='block';">
                <svg id="reticle-svg-fallback" viewBox="0 0 100 100" style="display: none; width: 76px; height: 76px; border: 2px solid white; border-radius: 10px; background: white;">
                    <circle cx="50" cy="50" r="42" fill="none" stroke="#999" stroke-width="2.5"/>
                    <circle cx="50" cy="50" r="36" fill="none" stroke="#999" stroke-width="2"/>
                    <circle cx="50" cy="50" r="31" fill="#1a1a1a"/>
                    <path d="M32 66 V34 H37 L42 46 L47 34 H52 V66 H47 V45 L42 54 L37 45 V66 Z" fill="#bbb"/>
                    <polygon points="58,34 76,50 58,66" fill="#bbb"/>
                </svg>
            </div>
        </div>

        <!-- Bottom Power Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0; pointer-events: none;">
            <div class="slider-end-mark"></div>
            <div class="slider-track-container mx-1">
                <div class="slider-track-left" id="power-fill"></div>
                <div class="slider-track-right"></div>
                <div class="slider-target-line" id="target-line"></div>
            </div>
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isGameActive = false;
        let hasGameStarted = false;
        let isScanningMarker = false;
        let scanTimeoutId = null;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        const chargeSpeed = 95; // Percentage per second
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for a successful throw

        let misses = 0;
        let score = 0;
        let isGameOver = false;

        // Three.js Variables
        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentTarget = null;
        let controls = null; // Visual-Inertial Tracker
        let lastTime = 0;

        // 3D Park Diorama Dimensions (8.5" x 11" footprint in meters)
        const DIORAMA_WIDTH_M = 0.2159;  // 8.5 inches
        const DIORAMA_DEPTH_M = 0.2794;  // 11.0 inches
        const INITIAL_ANCHOR_DIST = 0.9144; // 3 feet initial distance

        // World-Space Anchor & Visual Reticle Tracking Variables
        let anchorQuaternion = new THREE.Quaternion();
        let currentAnchorDist = INITIAL_ANCHOR_DIST;
        let targetAnchorDist = INITIAL_ANCHOR_DIST;
        let referenceReticleRadius = null;
        let lastTrackTime = 0;
        let lostTrackFrames = 0;
        let trackCanvas = null;
        let trackCtx = null;
        const trackRaycaster = new THREE.Raycaster();
        const trackNdc = new THREE.Vector2();

        // 3D Frisbee Variables
        let frisbeeMesh = null;
        let frisbeeActive = false;
        let frisbeeVelocity = new THREE.Vector3();
        let frisbeeTargetPoint = new THREE.Vector3();
        let frisbeeFlightTime = 0;
        let frisbeeIsHit = false;

        // Desktop Fallback Camera Aim Variables
        let isDraggingCamera = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let cameraYaw = 0;
        let cameraPitch = 0;

        // Procedural mottled grass texture matching reference shots
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#5da135';
            ctx.fillRect(0, 0, 256, 256);

            const shades = ['#3a6e1d', '#4d8c28', '#78ba43', '#9bd15c', '#c3e084', '#2e5917'];
            for (let i = 0; i < 3800; i++) {
                ctx.fillStyle = shades[Math.floor(Math.random() * shades.length)];
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const w = 1.5 + Math.random() * 3.5;
                const h = 2 + Math.random() * 5;
                ctx.fillRect(x, y, w, h);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2.5);
            return tex;
        }

        // Helper to build tapered olive-green tree trunks & branches
        function addTaperedSegment(parent, startVec, endVec, rBottom, rTop, material) {
            const dir = new THREE.Vector3().subVectors(endVec, startVec);
            const len = dir.length();
            if (len < 0.0001) return;

            const geo = new THREE.CylinderGeometry(rTop, rBottom, len, 10);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.copy(startVec).addScaledVector(dir, 0.5);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
            parent.add(mesh);
        }

        // Helper to build clustered dusty-pink / dark-underside leaf-card canopy
        function addLeafCluster(parent, center, radius, leafCount, leafGeo, leafMat) {
            const instanced = new THREE.InstancedMesh(leafGeo, leafMat, leafCount);
            const dummy = new THREE.Object3D();
            const color = new THREE.Color();

            for (let i = 0; i < leafCount; i++) {
                // Distribute leaves mostly on the shell of a slightly bumpy sphere
                const u = Math.random();
                const v = Math.random();
                const theta = 2 * Math.PI * u;
                const phi = Math.acos(2 * v - 1);
                const r = radius * (0.55 + 0.55 * Math.cbrt(Math.random()));

                const lx = r * Math.sin(phi) * Math.cos(theta);
                const ly = r * Math.cos(phi) * 0.92;
                const lz = r * Math.sin(phi) * Math.sin(theta);

                dummy.position.set(center.x + lx, center.y + ly, center.z + lz);
                dummy.rotation.set(
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2,
                    Math.random() * Math.PI * 2
                );
                const s = 0.75 + Math.random() * 0.65;
                dummy.scale.set(s, s, s);
                dummy.updateMatrix();
                instanced.setMatrixAt(i, dummy.matrix);

                // Top-lit dusty pink/cream on upper leaves, rich dark brown underneath
                const heightFactor = THREE.MathUtils.clamp((ly / Math.max(radius, 0.001) + 0.75) / 1.5, 0, 1);
                if (heightFactor > 0.68) {
                    color.setHex(0xebd2c8).lerp(new THREE.Color(0xdcb4a6), Math.random() * 0.5);
                } else if (heightFactor > 0.35) {
                    color.setHex(0xb88b7d).lerp(new THREE.Color(0x5c362c), Math.random() * 0.6);
                } else {
                    color.setHex(0x331a15).lerp(new THREE.Color(0x4a261f), Math.random() * 0.5);
                }
                instanced.setColorAt(i, color);
            }

            instanced.instanceMatrix.needsUpdate = true;
            if (instanced.instanceColor) instanced.instanceColor.needsUpdate = true;
            parent.add(instanced);
        }

        // Build the 3D Park Environment fitted strictly inside the Light-Blue Portal Cavity & Occluder Box
        function buildTargetTemplate() {
            targetTemplateMesh = new THREE.Group();
            targetTemplateMesh.name = 'park-portal-root';

            // Exact 8.5" x 11" cavity opening and interior bounds
            const cavityW = DIORAMA_WIDTH_M;
            const cavityH = DIORAMA_DEPTH_M;
            const cavityD = DIORAMA_DEPTH_M;

            // Pivot so targetTemplateMesh's local origin (0, 0, 0) is the exact center of the front opening
            const portalPivot = new THREE.Group();
            portalPivot.name = 'portal-center-pivot';
            portalPivot.position.set(0, -cavityH / 2, 0);
            targetTemplateMesh.add(portalPivot);

            const parkContentGroup = new THREE.Group();
            parkContentGroup.name = 'park-diorama-content';
            // Place the park floor flush at the bottom of the cavity (y = 0) and centered in depth (-cavityD/2)
            parkContentGroup.position.set(0, 0.004, -cavityD / 2);

            const baseW = DIORAMA_WIDTH_M * 0.98;
            const baseD = DIORAMA_DEPTH_M * 0.98;
            const baseH = 0.008;

            // 1. Mottled Grass Base
            const grassTex = createGrassTexture();
            const grassMat = new THREE.MeshStandardMaterial({
                map: grassTex,
                roughness: 0.92,
                metalness: 0.0
            });
            const grassGeo = new THREE.BoxGeometry(baseW, baseH, baseD);
            const grassMesh = new THREE.Mesh(grassGeo, grassMat);
            grassMesh.position.set(0, baseH / 2, 0);
            parkContentGroup.add(grassMesh);

            // Pale back-edge trim seen in reference shots
            const trimMat = new THREE.MeshStandardMaterial({ color: 0xe3e6dc, roughness: 0.85 });
            const trimGeo = new THREE.BoxGeometry(baseW, baseH + 0.001, 0.007);
            const trimMesh = new THREE.Mesh(trimGeo, trimMat);
            trimMesh.position.set(0, baseH / 2, -baseD / 2 + 0.0035);
            parkContentGroup.add(trimMesh);

            // 2. Curved Off-White Pathway (sweeping from mid-left -> front-center -> mid-right)
            const pathCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-baseW * 0.48, 0, baseD * 0.06),
                new THREE.Vector3(-baseW * 0.28, 0, baseD * 0.25),
                new THREE.Vector3(0.0, 0, baseD * 0.30),
                new THREE.Vector3(baseW * 0.28, 0, baseD * 0.20),
                new THREE.Vector3(baseW * 0.48, 0, -baseD * 0.02)
            ]);
            const pathPoints = pathCurve.getPoints(32);
            const pathHalfW = 0.019;
            const pathShape = new THREE.Shape();
            const leftPts = [];
            const rightPts = [];

            for (let i = 0; i < pathPoints.length; i++) {
                const p = pathPoints[i];
                const t = i / (pathPoints.length - 1);
                const tan = pathCurve.getTangent(t);
                const perp = new THREE.Vector3(-tan.z, 0, tan.x).normalize();
                leftPts.push(new THREE.Vector2(p.x + perp.x * pathHalfW, -(p.z + perp.z * pathHalfW)));
                rightPts.push(new THREE.Vector2(p.x - perp.x * pathHalfW, -(p.z - perp.z * pathHalfW)));
            }

            pathShape.moveTo(leftPts[0].x, leftPts[0].y);
            for (let i = 1; i < leftPts.length; i++) pathShape.lineTo(leftPts[i].x, leftPts[i].y);
            for (let i = rightPts.length - 1; i >= 0; i--) pathShape.lineTo(rightPts[i].x, rightPts[i].y);
            pathShape.closePath();

            const pathGeo = new THREE.ExtrudeGeometry(pathShape, { depth: 0.0025, bevelEnabled: false });
            pathGeo.rotateX(-Math.PI / 2);
            const pathMat = new THREE.MeshStandardMaterial({ color: 0xe6e4dc, roughness: 0.82, metalness: 0.0 });
            const pathMesh = new THREE.Mesh(pathGeo, pathMat);
            pathMesh.position.y = baseH + 0.0005;
            parkContentGroup.add(pathMesh);

            // 3. Front-Left Purple Retaining Block with Pastel Pink Top (fitted flush inside the base footprint)
            const blockW = 0.072;
            const blockH = 0.024;
            const blockD = 0.018;
            const blockSideMat = new THREE.MeshStandardMaterial({ color: 0x6b205c, roughness: 0.5 });
            const blockTopMat = new THREE.MeshStandardMaterial({ color: 0xf7cde4, roughness: 0.4 });
            const blockGeo = new THREE.BoxGeometry(blockW, blockH, blockD);
            const blockMesh = new THREE.Mesh(blockGeo, [
                blockSideMat, blockSideMat, blockTopMat, blockSideMat, blockSideMat, blockSideMat
            ]);
            blockMesh.position.set(-baseW * 0.5 + blockW * 0.5 + 0.003, baseH + blockH * 0.5 - 0.002, baseD * 0.5 - blockD * 0.5 - 0.003);
            parkContentGroup.add(blockMesh);

            // 4. Dark Mahogany Lamp Post with Overhanging Box Head
            const lampGroup = new THREE.Group();
            const lampMat = new THREE.MeshStandardMaterial({ color: 0x3b120e, roughness: 0.35, metalness: 0.15 });
            const poleGeo = new THREE.BoxGeometry(0.009, 0.118, 0.009);
            const poleMesh = new THREE.Mesh(poleGeo, lampMat);
            poleMesh.position.y = 0.059;
            lampGroup.add(poleMesh);

            const headGeo = new THREE.BoxGeometry(0.024, 0.012, 0.014);
            const headMesh = new THREE.Mesh(headGeo, lampMat);
            headMesh.position.set(-0.007, 0.114, 0);
            lampGroup.add(headMesh);

            const capGeo = new THREE.BoxGeometry(0.007, 0.005, 0.007);
            const capMesh = new THREE.Mesh(capGeo, lampMat);
            capMesh.position.set(-0.004, 0.122, 0);
            lampGroup.add(capMesh);

            lampGroup.position.set(0.044, baseH, 0.048);
            lampGroup.rotation.y = -0.45;
            parkContentGroup.add(lampGroup);

            // 5. Ribbed Green Trash Can beside Lamp Post
            const trashGroup = new THREE.Group();
            const trashMat = new THREE.MeshStandardMaterial({ color: 0x2a5420, roughness: 0.55, metalness: 0.3 });
            const canGeo = new THREE.CylinderGeometry(0.008, 0.0072, 0.022, 12);
            const canMesh = new THREE.Mesh(canGeo, trashMat);
            canMesh.position.y = 0.011;
            trashGroup.add(canMesh);

            const rimGeo = new THREE.TorusGeometry(0.008, 0.0011, 6, 14);
            rimGeo.rotateX(Math.PI / 2);
            const rimTop = new THREE.Mesh(rimGeo, trashMat);
            rimTop.position.y = 0.021;
            trashGroup.add(rimTop);

            const rimMid = new THREE.Mesh(rimGeo, trashMat);
            rimMid.position.y = 0.012;
            trashGroup.add(rimMid);

            trashGroup.position.set(0.028, baseH, 0.036);
            parkContentGroup.add(trashGroup);

            // 6. Purple-Topped Disc Golf Basket with Chains (Primary Hit Target)
            const basketGroup = new THREE.Group();
            basketGroup.name = 'disc-golf-basket';
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x8f99a3, roughness: 0.35, metalness: 0.7 });
            const purpleMat = new THREE.MeshStandardMaterial({ color: 0x6954d6, roughness: 0.3, metalness: 0.2 });

            const bPole = new THREE.Mesh(new THREE.CylinderGeometry(0.0014, 0.0018, 0.036, 8), metalMat);
            bPole.position.y = 0.018;
            basketGroup.add(bPole);

            const bBase = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.002, 12), metalMat);
            bBase.position.y = 0.001;
            basketGroup.add(bBase);

            const bTray = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.0085, 0.006, 12, 1, true), metalMat);
            bTray.position.y = 0.016;
            basketGroup.add(bTray);

            const bTop = new THREE.Mesh(new THREE.CylinderGeometry(0.0115, 0.0115, 0.0045, 14), purpleMat);
            bTop.position.y = 0.034;
            basketGroup.add(bTop);

            // Hanging chains
            const chainGeo = new THREE.CylinderGeometry(0.00045, 0.00045, 0.016, 4);
            for (let i = 0; i < 8; i++) {
                const ang = (i / 8) * Math.PI * 2;
                const chain = new THREE.Mesh(chainGeo, metalMat);
                chain.position.set(Math.cos(ang) * 0.0075, 0.024, Math.sin(ang) * 0.0075);
                chain.rotation.z = Math.cos(ang) * 0.14;
                chain.rotation.x = -Math.sin(ang) * 0.14;
                basketGroup.add(chain);
            }

            basketGroup.position.set(-0.022, baseH, 0.016);
            parkContentGroup.add(basketGroup);

            // 7. Three Olive-Green Branched Trees with Dusty-Pink Leaf-Card Canopies (scaled to fit inside cavity)
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x3b5218, roughness: 0.88, metalness: 0.0 });
            const leafGeo = new THREE.PlaneGeometry(0.0095, 0.0075);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.82,
                metalness: 0.0,
                side: THREE.DoubleSide
            });

            const treesGroup = new THREE.Group();
            treesGroup.position.y = baseH;

            // 8. Recessed Light-Blue Portal Cavity & Invisible Depth-Occluder Box (exact 3D environment bounds)
            // --- A. Invisible Outer Depth-Occluder Box & Front Mask Flange (renderOrder = -2) ---
            const occluderMat = new THREE.MeshBasicMaterial({

            // Floor interior wall

            cavBottom.position.set(0, 0, -cavityD / 2);
            cavBottom.rotation.x = -Math.PI / 2;
            cavityGroup.add(cavBottom);

            // Shadowed Entrance Collar inside the z = 0 aperture for crisp depth cue
            const collarDepth = 0.022;
            const collarMat = new THREE.MeshStandardMaterial({
                color: 0x1e2a36,

            const colLeft = new THREE.Mesh(new THREE.PlaneGeometry(collarDepth, cavityH), collarMat);

            cavityGroup.add(colLeft);

            const colRight = new THREE.Mesh(new THREE.PlaneGeometry(collarDepth, cavityH), collarMat);
            colRight.position.set(cavityW / 2 - 0.0005, cavityH / 2, -collarDepth / 2);
            colRight.rotation.y = -Math.PI / 2;
            cavityGroup.add(colRight);

            const colTop = new THREE.Mesh(new THREE.PlaneGeometry(cavityW, collarDepth), collarMat);
            colTop.position.set(0, cavityH - 0.0005, -collarDepth / 2);
            colTop.rotation.x = Math.PI / 2;
            cavityGroup.add(colTop);

            const colBottom = new THREE.Mesh(new THREE.PlaneGeometry(cavityW, collarDepth), collarMat);
            colBottom.position.set(0, 0.0005, -collarDepth / 2);

            cavityGroup.traverse((child) => {

        // Build Glossy 3D Frisbee (Blender-style LatheGeometry)
        function buildFrisbeeMesh() {

        // Start Live Rear Camera Feed
        async function startCameraFeed() {
            const video = document.getElementById('camera-feed');
            if (!video || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                video.srcObject = stream;
                await video.play().catch(() => {});
            } catch (err) {
                console.warn('Rear camera unavailable, trying fallback camera:', err);
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    await video.play().catch(() => {});
                } catch (fallbackErr) {
                    console.warn('Camera permission denied or unavailable:', fallbackErr);
                }
            }
        }

        // Initialize Three.js Scene, Camera, Lighting, and Visual-Inertial Controls
        function initThreeJS() {
            const container = document.getElementById('three-container');

            scene = new THREE.Scene();
            scene.background = null; // Transparent so live camera feed shows cleanly

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
            camera.position.set(0, 0, 0);
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            container.appendChild(renderer.domElement);

            // Lighting tuned for crisp diorama shading
            const hemiLight = new THREE.HemisphereLight(0xfffdf5, 0x3b4d2b, 0.95);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
            dirLight.position.set(1.5, 3.0, 2.0);
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xd9ecff, 0.45);
            fillLight.position.set(-1.5, 1.2, 1.0);
            scene.add(fillLight);

            // Visual-Inertial Tracking (3DOF Gyroscope/Accelerometer)
            if (typeof THREE.DeviceOrientationControls === 'function') {
                try {
                    controls = new THREE.DeviceOrientationControls(camera);
                } catch (err) {
                    console.warn('DeviceOrientationControls could not initialize:', err);
                    controls = null;
                }
            }

            buildTargetTemplate();
            buildFrisbeeMesh();

            window.addEventListener('resize', () => {
                if (!camera || !renderer) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        // Detect the exact 2D center (normX, normY) and apparent radius of the dark circular reticle
        // using an offscreen canvas cropped to match the video's CSS object-fit: cover viewport
        function detectReticleInFrame(searchNormX, searchNormY, searchRadiusNorm) {
            const video = document.getElementById('camera-feed');
            if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return null;

            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const viewW = window.innerWidth || 1;
            const viewH = window.innerHeight || 1;
            const viewAspect = viewW / viewH;
            const videoAspect = vw / vh;

            // Match offscreen canvas aspect ratio to the visible viewport
            const maxDim = 160;
            const tw = viewAspect >= 1 ? maxDim : Math.max(48, Math.round(maxDim * viewAspect));
            const th = viewAspect >= 1 ? Math.max(48, Math.round(maxDim / viewAspect)) : maxDim;

            if (!trackCanvas) {
                trackCanvas = document.createElement('canvas');
                trackCtx = trackCanvas.getContext('2d', { willReadFrequently: true });
            }
            if (trackCanvas.width !== tw || trackCanvas.height !== th) {
                trackCanvas.width = tw;
                trackCanvas.height = th;
            }

            // Compute exact source crop matching CSS object-fit: cover
            let sx = 0, sy = 0, sWidth = vw, sHeight = vh;
            if (videoAspect > viewAspect) {
                sHeight = vh;
                sWidth = vh * viewAspect;
                sx = (vw - sWidth) * 0.5;
            } else {
                sWidth = vw;
                sHeight = vw / viewAspect;
                sy = (vh - sHeight) * 0.5;
            }

            trackCtx.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, tw, th);
            const fullData = trackCtx.getImageData(0, 0, tw, th).data;

            const minDim = Math.min(tw, th);
            const predX = THREE.MathUtils.clamp(searchNormX, 0.05, 0.95) * tw;
            const predY = THREE.MathUtils.clamp(searchNormY, 0.05, 0.95) * th;
            const searchR = Math.max(14, Math.round(minDim * searchRadiusNorm));

            const x0 = Math.max(0, Math.floor(predX - searchR));
            const y0 = Math.max(0, Math.floor(predY - searchR));
            const x1 = Math.min(tw - 1, Math.ceil(predX + searchR));
            const y1 = Math.min(th - 1, Math.ceil(predY + searchR));

            // Pass 1: Local luminance statistics inside circular search region
            let lumMin = 255, lumMax = 0, lumSum = 0, pxCount = 0;
            const searchR2 = searchR * searchR;
            for (let y = y0; y <= y1; y++) {
                const dy = y - predY;
                for (let x = x0; x <= x1; x++) {
                    const dx = x - predX;
                    if (dx * dx + dy * dy > searchR2) continue;
                    const i = (y * tw + x) * 4;
                    const lum = 0.299 * fullData[i] + 0.587 * fullData[i + 1] + 0.114 * fullData[i + 2];
                    if (lum < lumMin) lumMin = lum;
                    if (lum > lumMax) lumMax = lum;
                    lumSum += lum;
                    pxCount++;
                }
            }
            if (pxCount < 20 || (lumMax - lumMin) < 42) return null;

            const lumMean = lumSum / pxCount;
            const darkThresh = lumMin + (lumMean - lumMin) * 0.45;

            // Weighted centroid of dark core pixels
            let sumX = 0, sumY = 0, sumW = 0, darkCount = 0;
            for (let y = y0; y <= y1; y++) {
                const dy = y - predY;
                for (let x = x0; x <= x1; x++) {
                    const dx = x - predX;
                    const d2 = dx * dx + dy * dy;
                    if (d2 > searchR2) continue;
                    const i = (y * tw + x) * 4;
                    const lum = 0.299 * fullData[i] + 0.587 * fullData[i + 1] + 0.114 * fullData[i + 2];
                    if (lum <= darkThresh) {
                        const darkness = (darkThresh - lum) + 1;
                        const spatialWeight = 1 / (1 + d2 / (searchR2 * 0.65));
                        const w = darkness * spatialWeight;
                        sumX += x * w;
                        sumY += y * w;
                        sumW += w;
                        darkCount++;
                    }
                }
            }
            if (darkCount < 14 || sumW <= 0) return null;

            const cx1 = sumX / sumW;
            const cy1 = sumY / sumW;
            // Divide by ~0.72 to account for the light-gray M & play icon inside the black circle
            const r1 = Math.sqrt((darkCount / 0.72) / Math.PI);
            if (r1 < 3.5 || r1 > minDim * 0.48) return null;

            // Pass 2: Unbiased refinement around (cx1, cy1) + bright-halo contrast verification
            const innerR = Math.max(4, r1 * 1.18);
            const outerR = Math.min(minDim * 0.5, r1 * 1.62);
            const innerR2 = innerR * innerR;
            const outerR2 = outerR * outerR;
            const rx0 = Math.max(0, Math.floor(cx1 - outerR));
            const ry0 = Math.max(0, Math.floor(cy1 - outerR));
            const rx1 = Math.min(tw - 1, Math.ceil(cx1 + outerR));
            const ry1 = Math.min(th - 1, Math.ceil(cy1 + outerR));

            let refX = 0, refY = 0, refCount = 0;
            let coreLumSum = 0, coreCount = 0;
            let ringLumSum = 0, ringCount = 0;

            for (let y = ry0; y <= ry1; y++) {
                const dy = y - cy1;
                for (let x = rx0; x <= rx1; x++) {
                    const dx = x - cx1;
                    const d2 = dx * dx + dy * dy;
                    if (d2 > outerR2) continue;
                    const i = (y * tw + x) * 4;
                    const lum = 0.299 * fullData[i] + 0.587 * fullData[i + 1] + 0.114 * fullData[i + 2];
                    if (d2 <= innerR2) {
                        coreLumSum += lum;
                        coreCount++;
                        if (lum <= darkThresh) {
                            refX += x;
                            refY += y;
                            refCount++;
                        }
                    } else {
                        ringLumSum += lum;
                        ringCount++;
                    }
                }
            }

            if (refCount < 12 || ringCount < 10) return null;
            const coreMean = coreLumSum / coreCount;
            const ringMean = ringLumSum / ringCount;
            if (ringMean - coreMean < 22) return null;

            const cx2 = refX / refCount;
            const cy2 = refY / refCount;
            const r2 = Math.sqrt((refCount / 0.72) / Math.PI);

            return {
                normX: cx2 / tw,
                normY: cy2 / th,
                radiusNorm: r2 / minDim
            };
        }

        // Continuously lock the 3D environment & occluder box center to the detected reticle in screen space
        function updateReticleAnchor(now) {
            if (!currentTarget) return;
            if (now - lastTrackTime < 33) return; // ~30Hz responsive visual tracking
            lastTrackTime = now;

            // Predict where the currently anchored reticle should appear on screen
            const projected = currentTarget.position.clone().project(camera);
            let searchX = 0.5;
            let searchY = 0.5;
            let searchRadius = 0.34;

            if (projected.z < 1 && Math.abs(projected.x) <= 1.05 && Math.abs(projected.y) <= 1.05) {
                searchX = (projected.x + 1) * 0.5;
                searchY = (1 - projected.y) * 0.5;
                searchRadius = lostTrackFrames > 6 ? 0.38 : 0.24;
            } else {
                lostTrackFrames++;
                return;
            }

            const det = detectReticleInFrame(searchX, searchY, searchRadius);
            if (!det) {
                lostTrackFrames++;
                return;
            }

            lostTrackFrames = 0;

            if (!referenceReticleRadius) {
                referenceReticleRadius = det.radiusNorm;
            }

            // Pinhole scale law: apparent reticle size controls depth distance along the camera ray
            const estimatedDist = INITIAL_ANCHOR_DIST * (referenceReticleRadius / det.radiusNorm);
            targetAnchorDist = THREE.MathUtils.clamp(estimatedDist, 0.28, 2.40);
            currentAnchorDist = THREE.MathUtils.lerp(currentAnchorDist, targetAnchorDist, 0.22);

            // Unproject detected reticle center (normX, normY) into 3D world space along the current camera ray
            trackNdc.set(det.normX * 2 - 1, 1 - det.normY * 2);
            trackRaycaster.setFromCamera(trackNdc, camera);
            const desiredWorldPos = trackRaycaster.ray.origin
                .clone()
                .addScaledVector(trackRaycaster.ray.direction, currentAnchorDist);

            // Anchor the 3D environment & occluder box center to the reticle while keeping world orientation fixed
            currentTarget.position.lerp(desiredWorldPos, 0.65);
            currentTarget.quaternion.copy(anchorQuaternion);
        }

        function spawnTargetOnReticle() {
            if (!targetTemplateMesh || activeTargets.length >= 1) return;

            camera.updateMatrixWorld();

            const initialDet = detectReticleInFrame(0.5, 0.5, 0.35);
            const spawnNormX = initialDet ? initialDet.normX : 0.5;
            const spawnNormY = initialDet ? initialDet.normY : 0.5;
            referenceReticleRadius = initialDet ? initialDet.radiusNorm : null;

            trackNdc.set(spawnNormX * 2 - 1, 1 - spawnNormY * 2);
            trackRaycaster.setFromCamera(trackNdc, camera);
            const scanPos = trackRaycaster.ray.origin
                .clone()
                .addScaledVector(trackRaycaster.ray.direction, INITIAL_ANCHOR_DIST);

            const targetClone = targetTemplateMesh.clone();
            targetClone.position.copy(scanPos);

            // Face the camera upright on the vertical wall plane and lock that world orientation
            const toCamX = camera.position.x - scanPos.x;
            const toCamZ = camera.position.z - scanPos.z;
            targetClone.rotation.set(0, Math.atan2(toCamX, toCamZ), 0);
            anchorQuaternion.copy(targetClone.quaternion);

            targetClone.userData.hitsRemaining = 3;
            currentAnchorDist = INITIAL_ANCHOR_DIST;
            targetAnchorDist = INITIAL_ANCHOR_DIST;

            scene.add(targetClone);
            activeTargets.push(targetClone);
            currentTarget = targetClone;
        }

        function startScanningForReticle() {
            isScanningMarker = true;
            const scannerUi = document.getElementById('scanner-ui');
            if (scannerUi) scannerUi.style.display = 'flex';

            clearTimeout(scanTimeoutId);
            scanTimeoutId = setTimeout(() => {
                completeReticleScan();
            }, 2200);
        }

        function completeReticleScan() {
            if (!isScanningMarker) return;
            isScanningMarker = false;
            clearTimeout(scanTimeoutId);

            const scannerUi = document.getElementById('scanner-ui');
            if (scannerUi) scannerUi.style.display = 'none';

            spawnTargetOnReticle();
            randomizeTargetLine();

            const topBanner = document.getElementById('top-banner');
            const bottomSlider = document.getElementById('bottom-slider');
            if (topBanner) topBanner.style.opacity = '1';
            if (bottomSlider) bottomSlider.style.opacity = '1';

            isGameActive = true;
        }

        function randomizeTargetLine() {
            targetPower = Math.floor(20 + Math.random() * 60);
            const targetLine = document.getElementById('target-line');
            if (targetLine) {
                targetLine.style.left = targetPower + '%';
            }
        }

        function showScorePopup() {
            const popup = document.getElementById('score-popup');
            if (!popup) return;
            popup.style.display = 'block';
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, -50%) scale(1.1)';

            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translate(-50%, -110%) scale(1.0)';
            }, 60);

            setTimeout(() => {
                popup.style.display = 'none';
            }, 680);
        }

        function throwFrisbee(powerPercent) {
            if (!frisbeeMesh || frisbeeActive || !isGameActive || isGameOver) return;

            frisbeeIsHit = Math.abs(powerPercent - targetPower) <= tolerance;
            frisbeeActive = true;
            frisbeeFlightTime = 0;

            camera.updateMatrixWorld();

            // Launch frisbee slightly below the camera center
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
            const startPos = camera.position.clone()
                .addScaledVector(forward, 0.16)
                .addScaledVector(up, -0.07);

            frisbeeMesh.position.copy(startPos);
            frisbeeMesh.quaternion.copy(camera.quaternion);
            frisbeeMesh.visible = true;

            if (frisbeeIsHit && currentTarget) {
                const basket = currentTarget.getObjectByName('disc-golf-basket');
                if (basket) {
                    basket.getWorldPosition(frisbeeTargetPoint);
                    frisbeeTargetPoint.y += 0.025;
                } else {
                    frisbeeTargetPoint.copy(currentTarget.position);
                }
            } else {
                // Miss trajectory based on under-power vs over-power
                const powerDelta = (powerPercent - targetPower) / 100;
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
                const missDist = currentTarget ? currentTarget.position.distanceTo(camera.position) + 0.35 : 1.3;
                frisbeeTargetPoint.copy(camera.position)
                    .addScaledVector(forward, missDist)
                    .addScaledVector(right, (Math.random() > 0.5 ? 1 : -1) * 0.28)
                    .addScaledVector(up, powerDelta * 0.65);
            }

            const flightDuration = 0.55;
            frisbeeVelocity.subVectors(frisbeeTargetPoint, startPos).divideScalar(flightDuration);
        }

        function handleMiss() {
            misses++;
            if (misses >= 20) {
                isGameOver = true;
                isGameActive = false;
                const overlay = document.getElementById('continue-overlay');
                if (overlay) overlay.style.display = 'flex';
            } else {
                randomizeTargetLine();
            }
        }

        function continueGame() {
            misses = 0;
            isGameOver = false;
            isGameActive = true;
            const overlay = document.getElementById('continue-overlay');
            if (overlay) overlay.style.display = 'none';
            randomizeTargetLine();
        }

        async function startGame(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            if (hasGameStarted) return;
            hasGameStarted = true;

            const scanBtn = document.getElementById('scan-btn');
            if (scanBtn) {
                scanBtn.style.opacity = '0';
                scanBtn.style.pointerEvents = 'none';
                setTimeout(() => { scanBtn.style.display = 'none'; }, 350);
            }

            // Request iOS 13+ DeviceOrientation permission inside user gesture
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    await DeviceOrientationEvent.requestPermission();
                } catch (err) {
                    console.warn('Orientation permission not granted:', err);
                }
            }

            // Start live camera feed without blocking Three.js setup
            startCameraFeed();
            initThreeJS();
            startScanningForReticle();
        }

        function animate(now) {
            requestAnimationFrame(animate);

            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Update Power Meter while charging
            if (isCharging && isGameActive && !isGameOver) {
                currentPower += powerDirection * chargeSpeed * dt;
                if (currentPower >= 100) {
                    currentPower = 100;
                    powerDirection = -1;
                } else if (currentPower <= 0) {
                    currentPower = 0;
                    powerDirection = 1;
                }
                const powerFill = document.getElementById('power-fill');
                if (powerFill) powerFill.style.width = currentPower + '%';
            }

            // Visual-Inertial Orientation + Live Reticle-Center World Anchoring
            if (controls && controls.deviceOrientation && controls.deviceOrientation.alpha !== null) {
                controls.update();
            } else if (camera) {
                camera.rotation.y = cameraYaw;
                camera.rotation.x = cameraPitch;
            }

            if (camera) {
                camera.updateMatrixWorld();
            }

            if (currentTarget) {
                updateReticleAnchor(now);
            }

            // Update 3D Frisbee Flight & Scoring
            if (frisbeeActive && frisbeeMesh) {
                frisbeeFlightTime += dt;
                frisbeeMesh.position.addScaledVector(frisbeeVelocity, dt);
                frisbeeMesh.rotation.y += 22 * dt;

                const distToGoal = frisbeeMesh.position.distanceTo(frisbeeTargetPoint);
                if (distToGoal < 0.065 || frisbeeFlightTime >= 0.62) {
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;

                    if (frisbeeIsHit) {
                        score++;
                        showScorePopup();
                        randomizeTargetLine();
                    } else {
                        handleMiss();
                    }
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Bind UI & Touch/Mouse Input Listeners
        document.addEventListener('DOMContentLoaded', () => {
            const scanBtn = document.getElementById('scan-btn');
            const continueBtn = document.getElementById('continue-btn');
            const scannerFrame = document.getElementById('scanner-frame');

            if (scanBtn) {
                scanBtn.addEventListener('click', startGame);
                scanBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: true });
                scanBtn.addEventListener('touchend', startGame, { passive: false });
            }

            if (continueBtn) {
                continueBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    continueGame();
                });
                continueBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    continueGame();
                }, { passive: false });
            }

            if (scannerFrame) {
                scannerFrame.addEventListener('click', (e) => {
                    e.stopPropagation();
                    completeReticleScan();
                });
                scannerFrame.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    completeReticleScan();
                }, { passive: false });
            }

            const beginCharge = () => {
                if (!isGameActive || isGameOver || frisbeeActive) return;
                isCharging = true;
                currentPower = 0;
                powerDirection = 1;
                const powerFill = document.getElementById('power-fill');
                if (powerFill) powerFill.style.width = '0%';
            };

            const releaseCharge = () => {
                if (!isCharging) return;
                isCharging = false;
                throwFrisbee(currentPower);
            };

            // Touch Controls (Charge & Throw)
            window.addEventListener('touchstart', (e) => {
                if (!isGameActive || isGameOver) return;
                if (e.target.closest('button') || e.target.closest('#scanner-frame')) return;
                beginCharge();
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (!isGameActive || isGameOver) return;
                releaseCharge();
            }, { passive: true });

            // Desktop Mouse Controls (Drag to Aim or Hold to Throw)
            window.addEventListener('mousedown', (e) => {
                if (!isGameActive || isGameOver) return;
                if (e.target.closest('button') || e.target.closest('#scanner-frame')) return;
                if (e.button === 2) {
                    isDraggingCamera = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                } else {
                    beginCharge();
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingCamera) return;
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                cameraYaw -= dx * 0.004;
                cameraPitch = THREE.MathUtils.clamp(cameraPitch - dy * 0.004, -Math.PI / 3, Math.PI / 3);
            });

            window.addEventListener('mouseup', () => {
                isDraggingCamera = false;
                releaseCharge();
            });

            window.addEventListener('contextmenu', (e) => e.preventDefault());

            // Desktop scroll-wheel proximity test
            window.addEventListener('wheel', (e) => {
                if (!isGameActive || !currentTarget) return;
                targetAnchorDist = THREE.MathUtils.clamp(targetAnchorDist + e.deltaY * 0.001, 0.28, 2.40);
                const dir = new THREE.Vector3().subVectors(currentTarget.position, camera.position).normalize();
                currentTarget.position.copy(camera.position).addScaledVector(dir, targetAnchorDist);
            }, { passive: true });
        });
    </script>
</body>
</html>
