<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - 3D Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Shrikhand', Georgia, serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Live Camera Video Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 60px 20px;
            pointer-events: none; /* Let touches pass through to Three.js scene */
        }

        /* Make specific UI elements interactive */
        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .banner-text-bg {
            -webkit-text-stroke: 10px #8B5CF6; /* Purple outline */
            color: #8B5CF6;
        }

        /* Center Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 12px 40px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s ease-in-out, transform 0.1s;
        }
        
        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 10px #246B3E; /* Dark green outline */
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            pointer-events: auto;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 8px;
            width: 0%;
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            width: 100%;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0;">
            <div class="text-outline-wrapper text-4xl sm:text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Start Button -->
        <button id="scan-btn" class="scan-button interactive-element" onclick="startGame()">
            <div class="text-outline-wrapper text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Start Game</span>
                <span class="text-outline-fg">Start Game</span>
            </div>
        </button>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1px black; z-index: 150; pointer-events: none; transition: transform 0.5s ease-out, opacity 0.5s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 200; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button onclick="continueGame()" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Simulated Image Scanner UI -->
        <div id="scanner-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">
            <div style="border: 4px dashed #74ED63; width: 220px; height: 220px; border-radius: 16px; position: relative; box-shadow: 0 0 20px rgba(116, 237, 99, 0.3); animation: pulse 2s infinite;">
                <div style="position: absolute; top: -40px; left: 0; width: 100%; text-align: center; color: #74ED63; font-weight: bold; font-family: sans-serif; font-size: 1.2rem; text-shadow: 2px 2px 4px black; -webkit-text-stroke: 1px black;">SCANNING RETICLE...</div>
                <div style="position: absolute; bottom: -40px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 0.9rem; text-shadow: 1px 1px 2px black;">Align scannable image in frame</div>
            </div>
            
            <!-- Reference Image for the User -->
            <div style="position: absolute; bottom: 100px; right: 20px; display: flex; flex-direction: column; align-items: center;">
                <span style="color: white; font-family: sans-serif; font-size: 0.8rem; text-shadow: 1px 1px 2px black; margin-bottom: 5px;">Target Marker</span>
                <img src="Scannable_Reticle.png" alt="Reticle Reference" style="width: 80px; height: 80px; border: 2px solid white; border-radius: 10px; background: rgba(0,0,0,0.5); object-fit: contain;">
            </div>
        </div>

        <style>
            @keyframes pulse {
                0% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
                50% { border-color: rgba(116, 237, 99, 0.3); box-shadow: 0 0 10px rgba(116, 237, 99, 0.1); }
                100% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
            }
        </style>

        <!-- Bottom Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0;">
            <div class="slider-end-mark"></div>
            <div class="slider-track-container mx-1">
                <div class="slider-track-left"></div>
                <div class="slider-track-right"></div>
                <div class="slider-target-line" id="target-line"></div>
            </div>
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isGameActive = false;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        let chargeSpeed = 2; // Pace at which the power increases
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for perfect throw

        let misses = 0;
        let isGameOver = false;

        // Three.js Variables
        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentTarget = null;
        let environmentGroup;

        // 3D Park Diorama Dimensions (matches 8.5" x 11" rectangular grass footprint in meters)
        const DIORAMA_WIDTH_M = 0.2159;  // 8.5 inches
        const DIORAMA_DEPTH_M = 0.2794;  // 11.0 inches

        // 3D Frisbee Variables
        let frisbeeMesh;
        let frisbeeActive = false;
        let frisbeeVelocity = new THREE.Vector3();
        let targetAim = null;

        // Camera Look / Drag Control Variables
        let isDraggingCamera = false;
        let pointerDownPos = { x: 0, y: 0 };
        let lastPointerPos = { x: 0, y: 0 };
        let cameraYaw = 0;
        let cameraPitch = 0;

        let isScanningMarker = false;
        let controls; // Visual-Inertial Tracker

        async function startCameraFeed() {
            const video = document.getElementById('camera-feed');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.warn('Camera feed unavailable or permission denied:', err);
            }
        }

        async function startGame() {
            const button = document.getElementById('scan-btn');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                button.style.opacity = '0';
                button.style.pointerEvents = 'none';
            }, 100);

            // Request Device Orientation Permission for Visual-Inertial Tracking (iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        console.warn('Device orientation permission not granted for visual-inertial tracking.');
                    }
                } catch (error) {
                    console.error('Error requesting device orientation permission:', error);
                }
            }

            await startCameraFeed();

            if (!renderer) {
                initThreeJS();
            }

            isGameActive = true;
            startScanningForReticle();
        }

        function initThreeJS() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = null; // Keep transparent so live camera feed shows through

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
            camera.position.set(0, 1.4, 0); // Eye level
            camera.rotation.order = 'YXZ';

            // Transparent renderer so the live camera feed shows through cleanly (no stencil shader)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting tuned to match the reference shots (bright warm top light + deep foliage undersides)
            const hemiLight = new THREE.HemisphereLight(0xfff5ec, 0x261712, 0.75);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffaf0, 1.35);
            dirLight.position.set(1.8, 4.5, 2.2);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xd8e2ff, 0.35);
            fillLight.position.set(-2.0, 1.5, -2.0);
            scene.add(fillLight);

            environmentGroup = new THREE.Group();
            scene.add(environmentGroup);

            // Initialize Device Orientation Tracking for AR feel
            controls = new THREE.DeviceOrientationControls(camera);

            // Build the 3D Park Environment directly from the reference shots
            buildTargetTemplate();

            // Build High-Detail Blender-Style 3D Frisbee
            buildFrisbeeMesh();

            window.addEventListener('resize', onWindowResize);
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Base lush meadow green
            ctx.fillStyle = '#5c9436';
            ctx.fillRect(0, 0, 256, 256);

            // Mottled light yellow-green and deep forest green blades/tufts
            const palette = ['#7eb84c', '#98cc64', '#427326', '#2e5718', '#b0db7d', '#548731'];
            for (let i = 0; i < 4200; i++) {
                ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const w = 1.5 + Math.random() * 3.5;
                const h = 1.5 + Math.random() * 4.5;
                ctx.fillRect(x, y, w, h);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2.6);
            return tex;
        }

        function createBranchTube(pointsArr, radiusBottom, radiusTop, material) {
            const curve = new THREE.CatmullRomCurve3(pointsArr);
            const tubularSegments = 16;
            const radialSegments = 10;
            const geo = new THREE.TubeGeometry(curve, tubularSegments, 1, radialSegments, false);

            // Taper radius smoothly from base to tip
            const pos = geo.attributes.position;
            const v = new THREE.Vector3();
            const center = new THREE.Vector3();

            for (let i = 0; i <= tubularSegments; i++) {
                const t = i / tubularSegments;
                curve.getPointAt(t, center);
                // Slight root flare at the very bottom
                const flare = t < 0.12 ? (1 + (0.12 - t) * 2.2) : 1.0;
                const r = THREE.MathUtils.lerp(radiusBottom, radiusTop, t) * flare;

                for (let j = 0; j <= radialSegments; j++) {
                    const idx = i * (radialSegments + 1) + j;
                    v.fromBufferAttribute(pos, idx);
                    v.sub(center).multiplyScalar(r).add(center);
                    pos.setXYZ(idx, v.x, v.y, v.z);
                }
            }
            geo.computeVertexNormals();

            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function addLeafCluster(parentGroup, clusters) {
            // Create a pointed leaf-card diamond geometry matching the Blender reference foliage
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0.0085);
            leafShape.quadraticCurveTo(0.0048, 0.002, 0, -0.0065);
            leafShape.quadraticCurveTo(-0.0048, 0.002, 0, 0.0085);

            const leafGeo = new THREE.ShapeGeometry(leafShape, 3);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.72,
                metalness: 0.04,
                side: THREE.DoubleSide
            });

            // Count total instanced leaves across all canopy clouds
            let totalLeaves = 0;
            clusters.forEach(c => { totalLeaves += c.count; });

            const instancedLeaves = new THREE.InstancedMesh(leafGeo, leafMat, totalLeaves);
            instancedLeaves.castShadow = true;
            instancedLeaves.receiveShadow = true;

            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            const leafPalette = [
                0xe6cec4, // warm light cream-blush (top highlights)
                0xd9b5a6, // dusty rose-beige
                0xc79d8d, // muted terracotta pink
                0xb08474, // deeper warm taupe
                0x6e4a3e  // dark shaded interior leaf
            ];

            let index = 0;
            clusters.forEach((c) => {
                for (let i = 0; i < c.count; i++) {
                    // Distribute leaves densely on and inside an organic ellipsoid cloud
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const radScale = Math.pow(Math.random(), 0.35);

                    const rx = c.rx * radScale * Math.sin(phi) * Math.cos(theta);
                    const ry = c.ry * radScale * Math.cos(phi);
                    const rz = c.rz * radScale * Math.sin(phi) * Math.sin(theta);

                    dummy.position.set(c.x + rx, c.y + ry, c.z + rz);
                    dummy.rotation.set(
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    );
                    const s = (0.75 + Math.random() * 0.75) * (c.leafScale || 1.0);
                    dummy.scale.set(s, s, s);
                    dummy.updateMatrix();
                    instancedLeaves.setMatrixAt(index, dummy.matrix);

                    // Top leaves brighter blush-cream, underside leaves darker brown-rose like reference renders
                    const heightBias = (ry / (c.ry || 1) + 1) * 0.5; // 0 bottom -> 1 top
                    let colorHex = leafPalette[Math.floor(Math.random() * 3)];
                    if (heightBias < 0.38) {
                        colorHex = Math.random() < 0.65 ? 0x523127 : 0x7d5346;
                    } else if (heightBias > 0.72) {
                        colorHex = Math.random() < 0.6 ? 0xefd9cf : 0xdeb9aa;
                    }
                    color.setHex(colorHex);
                    instancedLeaves.setColorAt(index, color);
                    index++;
                }
            });

            instancedLeaves.instanceMatrix.needsUpdate = true;
            if (instancedLeaves.instanceColor) {
                instancedLeaves.instanceColor.needsUpdate = true;
            }
            parentGroup.add(instancedLeaves);
        }

        function buildTargetTemplate() {
            // Root group for the entire 3D Park Environment sitting on top of the scannable reticle
            targetTemplateMesh = new THREE.Group();
            targetTemplateMesh.name = 'park-diorama-root';

            const W = DIORAMA_WIDTH_M;  // X width: 0.2159m (-0.108 to +0.108)
            const D = DIORAMA_DEPTH_M;  // Z depth: 0.2794m (-0.140 back to +0.140 front)
            const baseThickness = 0.008;

            // 1. Grass Base Platform (rectangular 8.5" x 11" proportion)
            const grassTex = createGrassTexture();
            const grassTopMat = new THREE.MeshStandardMaterial({
                map: grassTex,
                roughness: 0.92,
                metalness: 0.0
            });
            const grassEdgeMat = new THREE.MeshStandardMaterial({ color: 0x3b6622, roughness: 0.95 });
            const grassBase = new THREE.Mesh(
                new THREE.BoxGeometry(W, baseThickness, D),
                [grassEdgeMat, grassEdgeMat, grassTopMat, grassEdgeMat, grassEdgeMat, grassEdgeMat]
            );
            grassBase.position.set(0, baseThickness * 0.5, 0);
            grassBase.receiveShadow = true;
            grassBase.castShadow = true;
            targetTemplateMesh.add(grassBase);

            // Subtle pale trim strip along the back edge (visible in topview & backview)
            const backTrim = new THREE.Mesh(
                new THREE.BoxGeometry(W, baseThickness * 0.85, 0.005),
                new THREE.MeshStandardMaterial({ color: 0xd8dfd0, roughness: 0.85 })
            );
            backTrim.position.set(0, baseThickness * 0.52, -D * 0.5 + 0.0025);
            backTrim.receiveShadow = true;
            targetTemplateMesh.add(backTrim);

            // 2. Curved Off-White Pathway (sweeps from mid-left -> front-center -> mid-right)
            const pathCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-W * 0.49, 0, 0.010),
                new THREE.Vector3(-W * 0.36, 0, 0.056),
                new THREE.Vector3(-W * 0.08, 0, 0.082),
                new THREE.Vector3(W * 0.22, 0, 0.072),
                new THREE.Vector3(W * 0.37, 0, 0.030),
                new THREE.Vector3(W * 0.495, 0, -0.008)
            ]);
            const pathPoints = pathCurve.getPoints(36);
            const halfPathW = 0.0175;
            const pathShapePtsLeft = [];
            const pathShapePtsRight = [];

            for (let i = 0; i < pathPoints.length; i++) {
                const p = pathPoints[i];
                const tangent = pathCurve.getTangent(i / (pathPoints.length - 1)).normalize();
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x);
                pathShapePtsLeft.push(new THREE.Vector2(p.x + normal.x * halfPathW, -(p.z + normal.z * halfPathW)));
                pathShapePtsRight.push(new THREE.Vector2(p.x - normal.x * halfPathW, -(p.z - normal.z * halfPathW)));
            }
            const pathShape = new THREE.Shape(pathShapePtsLeft.concat(pathShapePtsRight.reverse()));
            const pathGeo = new THREE.ExtrudeGeometry(pathShape, { depth: 0.0035, bevelEnabled: false });
            pathGeo.rotateX(-Math.PI / 2);
            const pathMat = new THREE.MeshStandardMaterial({
                color: 0xebe8e0,
                roughness: 0.82,
                metalness: 0.02
            });
            const pathwayMesh = new THREE.Mesh(pathGeo, pathMat);
            pathwayMesh.position.y = baseThickness;
            pathwayMesh.receiveShadow = true;
            targetTemplateMesh.add(pathwayMesh);

            // 3. Front-Left Purple Block with Pastel Pink Top (retaining wall / bench accent)
            const blockW = W * 0.56;
            const blockH = 0.044;
            const blockD = 0.024;
            const purpleSideMat = new THREE.MeshStandardMaterial({ color: 0x6b1d57, roughness: 0.55 });
            const pinkTopMat = new THREE.MeshStandardMaterial({ color: 0xfad2e9, roughness: 0.45 });
            const accentBlock = new THREE.Mesh(
                new THREE.BoxGeometry(blockW, blockH, blockD),
                [purpleSideMat, purpleSideMat, pinkTopMat, purpleSideMat, purpleSideMat, purpleSideMat]
            );
            // Positioned flush along the front-left edge, extending slightly left and down as in the references
            accentBlock.position.set(-W * 0.34, -blockH * 0.30 + baseThickness, D * 0.5 + blockD * 0.42);
            accentBlock.castShadow = true;
            accentBlock.receiveShadow = true;
            targetTemplateMesh.add(accentBlock);

            // 4. Dark Reddish-Brown Modern Lamp Post (front-right bend of the pathway)
            const lampGroup = new THREE.Group();
            const lampMat = new THREE.MeshStandardMaterial({
                color: 0x3b0c08,
                roughness: 0.32,
                metalness: 0.18
            });
            const postH = 0.165;
            const lampPole = new THREE.Mesh(new THREE.BoxGeometry(0.011, postH, 0.011), lampMat);
            lampPole.position.y = postH * 0.5;
            lampPole.castShadow = true;
            lampGroup.add(lampPole);

            // Overhanging rectangular luminaire head + small top nub
            const lampHead = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.015, 0.020), lampMat);
            lampHead.position.set(-0.008, postH - 0.004, 0);
            lampHead.castShadow = true;
            lampGroup.add(lampHead);

            const lampNub = new THREE.Mesh(new THREE.BoxGeometry(0.007, 0.006, 0.007), lampMat);
            lampNub.position.set(-0.008, postH + 0.006, 0);
            lampGroup.add(lampNub);

            // Subtle warm glowing lens underneath head
            const lampLens = new THREE.Mesh(
                new THREE.PlaneGeometry(0.018, 0.012),
                new THREE.MeshBasicMaterial({ color: 0xffe9b5, side: THREE.DoubleSide })
            );
            lampLens.rotation.x = Math.PI / 2;
            lampLens.position.set(-0.012, postH - 0.012, 0);
            lampGroup.add(lampLens);

            lampGroup.position.set(0.044, baseThickness, 0.070);

            // 7. Three Stylized Olive-Green Trees with Fluffy Dusty-Pink Leaf-Card Canopies

            treesGroup.add(createBranchTube([

            treesGroup.add(createBranchTube([

            targetTemplateMesh.add(treesGroup);

            // Fluffy Dusty-Pink / Cream Leaf-Card Canopy Clouds matching all 8 reference angles
            const canopyClusters = [
                // Tree 1 Crown (high double-lobed cloud)
                { x: -0.048, y: 0.355, z: -0.056, rx: 0.042, ry: 0.040, rz: 0.042, count: 240, leafScale: 1.05 },
                { x: -0.005, y: 0.335, z: -0.068, rx: 0.038, ry: 0.036, rz: 0.038, count: 210, leafScale: 1.0 },

                // Tree 2 Canopy Clouds (center & right)
                { x: 0.008, y: 0.215, z: -0.052, rx: 0.040, ry: 0.038, rz: 0.040, count: 220, leafScale: 0.95 },

                { x: 0.090, y: 0.112, z: -0.052, rx: 0.014, ry: 0.014, rz: 0.014, count: 50, leafScale: 0.65 },
                { x: 0.050, y: 0.122, z: -0.044, rx: 0.013, ry: 0.013, rz: 0.013, count: 45, leafScale: 0.65 }

        }

        function buildFrisbeeMesh() {
            // LatheGeometry profile mimicking a Blender-modeled aerodynamic disc
            const points = [
                new THREE.Vector2(0.000, 0.014),
                new THREE.Vector2(0.035, 0.014),
                new THREE.Vector2(0.062, 0.011),
                new THREE.Vector2(0.075, 0.005),
                new THREE.Vector2(0.078, -0.004),
                new THREE.Vector2(0.072, -0.006),
                new THREE.Vector2(0.068, 0.004),
                new THREE.Vector2(0.055, 0.009),
                new THREE.Vector2(0.000, 0.010)
            ];

            const latheGeo = new THREE.LatheGeometry(points, 48);
            const frisbeeMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                roughness: 0.18,
                metalness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });

            frisbeeMesh = new THREE.Mesh(latheGeo, frisbeeMat);
            frisbeeMesh.castShadow = true;

            // Add aerodynamic flight rings on top of the disc
            const grooveGeo = new THREE.RingGeometry(0.045, 0.049, 48);
            const grooveMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, side: THREE.DoubleSide });
            const grooveMesh = new THREE.Mesh(grooveGeo, grooveMat);
            grooveMesh.rotation.x = -Math.PI / 2;
            grooveMesh.position.y = 0.0142;
            frisbeeMesh.add(grooveMesh);

            frisbeeMesh.visible = false;
            scene.add(frisbeeMesh);
        }

        function startScanningForReticle() {
            isScanningMarker = true;
            document.getElementById('top-banner').style.opacity = '0';
            document.getElementById('bottom-slider').style.opacity = '0';
            document.getElementById('scanner-ui').style.display = 'flex';

            // Simulate the time it takes to detect "Scannable_Reticle.png"
            setTimeout(() => {
                if (!isGameActive || isGameOver) return;
                
                document.getElementById('scanner-ui').style.display = 'none';
                document.getElementById('top-banner').style.opacity = '1';
                document.getElementById('bottom-slider').style.opacity = '1';
                isScanningMarker = false;
                
                spawnTargetOnReticle();
                randomizeTargetLine();
            }, 3000); // 3 second scan delay
        }

        function spawnTargetOnReticle() {
            if (!targetTemplateMesh || activeTargets.length >= 1) return;

            // Spawn the 3D park environment sitting upright on top of the scanned reticle ~3 feet away
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const scanPos = camera.position.clone().addScaledVector(forward, 0.9144); // Exactly 3 feet away
            scanPos.y -= 0.14; // Place grass base slightly below eye-line so the 3D diorama rises naturally on top of the reticle

            const targetClone = targetTemplateMesh.clone();
            targetClone.position.copy(scanPos);

            // Keep diorama upright (trees vertical) while rotating horizontally to face the player's front view
            const toCamX = camera.position.x - scanPos.x;
            const toCamZ = camera.position.z - scanPos.z;
            targetClone.rotation.set(0, Math.atan2(toCamX, toCamZ), 0);

            targetClone.userData.hitsRemaining = 3;

            scene.add(targetClone);
            activeTargets.push(targetClone);
            currentTarget = targetClone;
        }

        function startChargingFrisbee() {
            if (isGameOver || !isGameActive || frisbeeActive || isScanningMarker) return;
            isCharging = true;
            currentPower = 0;
            powerDirection = 1;
        }

        function releaseFrisbee() {
            if (!isGameActive || isGameOver || frisbeeActive || isScanningMarker) return;

            const diff = Math.abs(currentPower - targetPower);
            const isHit = diff <= tolerance;

            // Spawn 3D frisbee just below camera view
            const camPos = camera.position.clone();
            const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();

            frisbeeMesh.position.copy(camPos)
                .addScaledVector(camDir, 0.15)
                .addScaledVector(upVec, -0.10);
            frisbeeMesh.quaternion.copy(camera.quaternion);
            frisbeeMesh.visible = true;
            frisbeeActive = true;

            if (isHit && currentTarget) {
                // Aim directly at the purple disc golf basket inside the 3D park environment
                targetAim = currentTarget;
                const aimPoint = new THREE.Vector3();
                const basket = currentTarget.getObjectByName('disc-golf-basket');
                if (basket) {
                    basket.getWorldPosition(aimPoint);
                    aimPoint.y += 0.025;
                } else {
                    currentTarget.getWorldPosition(aimPoint);
                    aimPoint.y += 0.08;
                }
                const dirToTarget = new THREE.Vector3().subVectors(aimPoint, frisbeeMesh.position).normalize();
                frisbeeVelocity.copy(dirToTarget).multiplyScalar(2.8);
            } else {
                // Miss trajectory based on how much player over/under-charged
                targetAim = null;
                const powerDelta = (currentPower - targetPower) / 100;
                const missDir = camDir.clone();
                missDir.y += powerDelta * 0.65;
                missDir.x += (Math.random() - 0.5) * 0.25;
                missDir.normalize();
                frisbeeVelocity.copy(missDir).multiplyScalar(2.6);
            }
        }

        function handleFrisbeeHit(targetObj) {
            if (!targetObj) return;

            // Slide "+ 1 Point" 2 pixels above the hit target
            showScorePopupAboveTarget(targetObj);

            targetObj.userData.hitsRemaining = (targetObj.userData.hitsRemaining || 1) - 1;

            // Subtle scale pulse feedback on the disc golf basket when hit
            const basket = targetObj.getObjectByName('disc-golf-basket');
            if (basket) {
                basket.scale.set(1.22, 1.22, 1.22);
                setTimeout(() => {
                    if (basket) basket.scale.set(1, 1, 1);
                }, 180);
            }

            // After 3 hits, clear target & rescan for the scannable reticle
            if (targetObj.userData.hitsRemaining <= 0) {
                scene.remove(targetObj);
                activeTargets = activeTargets.filter(t => t !== targetObj);
                if (currentTarget === targetObj) {
                    currentTarget = null;
                }
                startScanningForReticle();
            } else {
                randomizeTargetLine();
            }
        }

        function handleFrisbeeMiss() {
            misses++;
            if (misses >= 20) {
                isGameOver = true;
                isCharging = false;
                document.getElementById('continue-overlay').style.display = 'flex';
            }
        }

        function continueGame() {
            misses = 0;
            isGameOver = false;
            document.getElementById('continue-overlay').style.display = 'none';
            updatePowerMeter(0);
        }

        function showScorePopupAboveTarget(targetObj) {
            const popup = document.getElementById('score-popup');
            const worldPos = new THREE.Vector3();
            targetObj.getWorldPosition(worldPos);
            worldPos.project(camera);

            const screenX = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = (-(worldPos.y * 0.5) + 0.5) * window.innerHeight;

            popup.style.transition = 'none';
            popup.style.left = `${screenX}px`;
            popup.style.top = `${screenY}px`;
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, -50%)';
            popup.style.display = 'block';

            // Force reflow then slide 2 pixels upwards
            void popup.offsetWidth;
            popup.style.transition = 'transform 0.45s ease-out, opacity 0.45s ease-out';
            popup.style.transform = 'translate(-50%, calc(-50% - 2px))';
            popup.style.opacity = '0';

            setTimeout(() => {
                popup.style.display = 'none';
            }, 460);
        }

        function randomizeTargetLine() {
            targetPower = Math.floor(Math.random() * 65) + 20; // Between 20% and 85%
            document.getElementById('target-line').style.left = `${targetPower}%`;
        }

        function updatePowerMeter(power) {
            const clamped = Math.max(0, Math.min(100, power));
            document.querySelector('.slider-track-left').style.width = `${clamped}%`;
            document.querySelector('.slider-track-right').style.width = `${100 - clamped}%`;
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Three.js Animation Loop
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Update Power Meter Charging
            if (isCharging && !isGameOver) {
                currentPower += chargeSpeed * powerDirection;
                if (currentPower >= 100) {
                    currentPower = 100;
                    powerDirection = -1;
                } else if (currentPower <= 0) {
                    currentPower = 0;
                    powerDirection = 1;
                }
                updatePowerMeter(currentPower);
            }

            // Apply Visual-Inertial Tracking to Camera
            if (controls && controls.deviceOrientation && controls.deviceOrientation.alpha !== null) {
                controls.update();
            }

            // Update 3D Frisbee Flight & Check Collisions
            if (frisbeeActive) {
                frisbeeMesh.position.addScaledVector(frisbeeVelocity, dt);
                frisbeeMesh.rotation.y += 18 * dt; // Fast aerodynamic disc spin

                // Check 3D collider intersection against active 3D park environment / disc golf basket
                let collidedTarget = null;
                const frisbeeRadius = 0.078;
                const targetHitRadius = Math.max(DIORAMA_WIDTH_M, DIORAMA_DEPTH_M) * 0.5;
                const targetCenter = new THREE.Vector3();

                for (const target of activeTargets) {
                    const basket = target.getObjectByName('disc-golf-basket');
                    if (basket) {
                        basket.getWorldPosition(targetCenter);
                        targetCenter.y += 0.025;
                    } else {
                        target.getWorldPosition(targetCenter);
                        targetCenter.y += 0.08;
                    }
                    const dist = frisbeeMesh.position.distanceTo(targetCenter);
                    if (dist <= (frisbeeRadius + targetHitRadius)) {
                        collidedTarget = target;
                        break;
                    }
                }

                if (collidedTarget) {
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleFrisbeeHit(collidedTarget);
                    updatePowerMeter(0);
                } else if (frisbeeMesh.position.distanceTo(camera.position) > 1.8) {
                    // Missed target and flew past arena wall
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleFrisbeeMiss();
                    updatePowerMeter(0);
                }
            }

            renderer.render(scene, camera);
        }

        // Pointer / Touch Input: Tap & Hold to Charge/Throw, Drag to Look Around
        function handlePointerDown(e) {
            if (isGameOver || !isGameActive || (e.target && e.target.closest('.interactive-element'))) return;

            isDraggingCamera = true;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            lastPointerPos = { x: e.clientX, y: e.clientY };

            if (!isCharging && !frisbeeActive) {
                startChargingFrisbee();
            }
        }

        function handlePointerMove(e) {
            if (!isDraggingCamera || !camera) return;

            const dx = e.clientX - lastPointerPos.x;
            const dy = e.clientY - lastPointerPos.y;
            lastPointerPos = { x: e.clientX, y: e.clientY };

            // Manual drag-look is overridden by the device's visual-inertial tracking, 
            // but we maintain the state for desktop testing fallback.
            cameraYaw -= dx * 0.0035;
            cameraPitch -= dy * 0.0035;

            cameraYaw = Math.max(-0.85, Math.min(0.85, cameraYaw));
            cameraPitch = Math.max(-0.45, Math.min(0.45, cameraPitch));
            
            if (!controls || !controls.deviceOrientation || controls.deviceOrientation.alpha === null) {
                camera.rotation.y = cameraYaw;
                camera.rotation.x = cameraPitch;
            }
        }

        function handlePointerUp() {
            isDraggingCamera = false;
            if (isCharging) {
                isCharging = false;
                releaseFrisbee();
            }
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
    </script>
