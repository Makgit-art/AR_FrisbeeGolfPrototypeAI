<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - AR UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Start with solid black background */
            font-family: 'Shrikhand', Georgia, serif; 
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 60px 20px;
            pointer-events: none; /* Let touches pass through to WebXR scene */
        }

        /* Make specific UI elements interactive */
        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            position: relative;
            z-index: 100;
        }

        .banner-text-bg {
            -webkit-text-stroke: 10px #8B5CF6; /* Purple outline */
            color: #8B5CF6;
        }

        /* Center Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 12px 40px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            opacity: 1; /* Visible initially */
            transition: opacity 0.5s ease-in-out, transform 0.1s;
        }
        
        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 10px #246B3E; /* Dark green outline */
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            pointer-events: auto;
            z-index: 100;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 8px;
            width: 0%; /* Start at 0 power */
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            width: 100%;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            position: absolute;
            left: 50%; /* Will be set by JS */
            transform: translateX(-50%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- WebXR Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- AR UI Overlay (Displayed via WebXR DOM Overlay on Mobile AR) -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0;">
            <div class="text-outline-wrapper text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Button -->
        <button id="scan-btn" class="scan-button interactive-element" onclick="startWebXR()">
            <div class="text-outline-wrapper text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Enter WebXR</span>
                <span class="text-outline-fg">Enter WebXR</span>
            </div>
        </button>

        <!-- WebXR Status / Error Message Box -->
        <div id="xr-status-msg" style="display: none; background-color: rgba(0, 0, 0, 0.85); color: #74ED63; border: 3px solid #74ED63; border-radius: 16px; padding: 16px 24px; font-family: monospace; font-size: 1.1rem; text-align: center; max-width: 85%; z-index: 300; pointer-events: auto;"></div>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1px black; z-index: 150; pointer-events: none; transition: transform 0.5s ease-out, opacity 0.5s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 200; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button onclick="continueGame()" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Bottom Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0;">
            <!-- Left Marker -->
            <div class="slider-end-mark"></div>
            
            <!-- Track -->
            <div class="slider-track-container mx-1">
                <!-- Filled portion (Purple with black borders) -->
                <div class="slider-track-left"></div>
                <!-- Unfilled portion (Solid black) -->
                <div class="slider-track-right"></div>
                <!-- Target Line (Green) -->
                <div class="slider-target-line" id="target-line"></div>
            </div>

            <!-- Right Marker -->
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isARActive = false;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        let chargeSpeed = 2; // Pace at which the power increases
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for perfect throw

        let misses = 0;
        let isGameOver = false;

        // WebXR & ThreeJS Variables
        let xrSession = null;
        let xrRefSpace = null;
        let xrViewerSpace = null;
        let xrHitTestSource = null;
        let hitTestSourceRequested = false;

        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentWebXRTarget = null;
        
        // 3D Frisbee Variables
        let frisbeeMesh;
        let xrFrisbeeActive = false;
        let xrFrisbeeVelocity = new THREE.Vector3();
        let xrTargetAim = null;

        // 3D Spatial HUD Power Meter for XR Viewers (Headsets/Glasses without DOM Overlay)
        let isHeadsetViewer = false;
        let hudGroup, hudFillMesh, hudTargetLineMesh;

        function showXRStatus(message) {
            const statusBox = document.getElementById('xr-status-msg');
            statusBox.textContent = message;
            statusBox.style.display = 'block';
        }

        async function startWebXR() {
            const button = document.getElementById('scan-btn');
            document.getElementById('xr-status-msg').style.display = 'none';
            
            // Brief visual feedback on button press
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
            }, 100);

            if (!navigator.xr) {
                showXRStatus("WebXR API is not available in this browser. Please open in a WebXR-enabled mobile browser or XR headset.");
                return;
            }

            try {
                const isImmersiveARSupported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!isImmersiveARSupported) {
                    showXRStatus("Immersive AR is not supported on this device.");
                    return;
                }

                button.style.opacity = '0';
                button.style.pointerEvents = 'none';

                initThreeJS();
                
                // Request pure WebXR 'immersive-ar' session
                const session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['local'],
                    optionalFeatures: ['dom-overlay', 'hit-test', 'local-floor'],
                    domOverlay: { root: document.getElementById('ui-layer') }
                });
                
                onSessionStarted(session);
            } catch (error) {
                console.error("Failed to start WebXR session:", error);
                button.style.opacity = '1';
                button.style.pointerEvents = 'auto';
                showXRStatus("Could not start WebXR session: " + error.message);
            }
        }

        // --- Pure WebXR & Three.js Setup ---
        function initThreeJS() {
            if (renderer) return; // Prevent duplicate initialization

            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = null; // Transparent background for real-world camera pass-through
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            
            // Enhanced Lighting for "Blender" 3D look
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
            hemiLight.position.set(0, 1, 0);
            scene.add(hemiLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            window.addEventListener('resize', () => {
                if (!renderer || renderer.xr.isPresenting) return;
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // High-quality "Blender-modeled" 3D Frisbee
            const discPoints = [
                new THREE.Vector2(0, 0.005),
                new THREE.Vector2(0.06, 0.005),
                new THREE.Vector2(0.08, 0.002),
                new THREE.Vector2(0.09, -0.005),
                new THREE.Vector2(0.09, -0.015),
                new THREE.Vector2(0.085, -0.015),
                new THREE.Vector2(0.08, -0.005),
                new THREE.Vector2(0.06, 0.00),
                new THREE.Vector2(0, 0.00)
            ];
            const frisbeeGeom = new THREE.LatheGeometry(discPoints, 64);
            const frisbeeMat = new THREE.MeshPhysicalMaterial({ 
                color: 0x00BFFF, // Bright blue
                metalness: 0.1,
                roughness: 0.2,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });
            frisbeeMesh = new THREE.Mesh(frisbeeGeom, frisbeeMat);
            frisbeeMesh.visible = false;
            scene.add(frisbeeMesh);

            // 3D Spatial HUD Power Meter for XR Viewers (when DOM overlay isn't supported)
            hudGroup = new THREE.Group();
            
            const bgGeom = new THREE.BoxGeometry(0.24, 0.035, 0.004);
            const bgMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const bgMesh = new THREE.Mesh(bgGeom, bgMat);
            hudGroup.add(bgMesh);

            const fillGeom = new THREE.BoxGeometry(0.22, 0.02, 0.006);
            const fillMat = new THREE.MeshBasicMaterial({ color: 0xD282FF });
            hudFillMesh = new THREE.Mesh(fillGeom, fillMat);
            hudFillMesh.position.z = 0.002;
            hudFillMesh.scale.x = 0.001;
            hudFillMesh.position.x = -0.11;
            hudGroup.add(hudFillMesh);

            const targetGeom = new THREE.BoxGeometry(0.006, 0.032, 0.008);
            const targetMat = new THREE.MeshBasicMaterial({ color: 0x74ED63 });
            hudTargetLineMesh = new THREE.Mesh(targetGeom, targetMat);
            hudTargetLineMesh.position.z = 0.003;
            hudGroup.add(hudTargetLineMesh);

            hudGroup.position.set(0, -0.18, -0.6);
            hudGroup.visible = false;
            camera.add(hudGroup);
            scene.add(camera);

            // True AR Bullseye Target Template (Floating 3D Rings, 10x10 consistent scale)
            targetTemplateMesh = new THREE.Group();
            const colors = [0xff0000, 0xffffff, 0xff0000];
            const radii = [0.127, 0.085, 0.042];
            const tube = 0.02;
            
            for (let i = 0; i < 3; i++) {
                const geom = new THREE.TorusGeometry(radii[i], tube, 32, 64);
                const mat = new THREE.MeshPhysicalMaterial({ 
                    color: colors[i],
                    metalness: 0.1,
                    roughness: 0.4,
                    clearcoat: 0.5
                });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.name = "ring_" + i;
                mesh.position.z = i * 0.02;
                targetTemplateMesh.add(mesh);
            }
            targetTemplateMesh.visible = false;
        }

        function onSessionStarted(session) {
            xrSession = session;
            
            // Detect if running on a Head-Mounted XR Viewer (lacks domOverlayState)
            isHeadsetViewer = !session.domOverlayState;
            if (isHeadsetViewer && hudGroup) {
                hudGroup.visible = true;
                updatePowerMeter(0);
            }

            // Reveal Game UI in DOM Overlay
            document.getElementById('top-banner').style.opacity = '1';
            document.getElementById('bottom-slider').style.opacity = '1';
            document.getElementById('top-banner').style.pointerEvents = 'auto';
            document.getElementById('bottom-slider').style.pointerEvents = 'auto';
            isARActive = true;

            // WebXR Session Lifecycle & Controller Events
            session.addEventListener('end', onSessionEnded);
            session.addEventListener('selectstart', onXRSelectStart);
            session.addEventListener('selectend', onXRSelectEnd);

            renderer.xr.setReferenceSpaceType('local');
            renderer.xr.setSession(session);
            
            session.requestReferenceSpace('local').then((refSpace) => {
                xrRefSpace = refSpace;
                renderer.setAnimationLoop(renderXR);
            });
        }

        function onSessionEnded() {
            xrSession = null;
            xrRefSpace = null;
            xrViewerSpace = null;
            xrHitTestSource = null;
            hitTestSourceRequested = false;
            isARActive = false;
            isCharging = false;
            xrFrisbeeActive = false;

            if (renderer) {
                renderer.setAnimationLoop(null);
            }

            // Clean up active 3D targets
            activeTargets.forEach(t => scene.remove(t));
            activeTargets = [];
            currentWebXRTarget = null;
            if (frisbeeMesh) frisbeeMesh.visible = false;
            if (hudGroup) hudGroup.visible = false;

            // Reset UI back to Entry State
            const button = document.getElementById('scan-btn');
            button.style.opacity = '1';
            button.style.pointerEvents = 'auto';
            document.getElementById('top-banner').style.opacity = '0';
            document.getElementById('bottom-slider').style.opacity = '0';
            document.getElementById('continue-overlay').style.display = 'none';
        }

        function onXRSelectStart(event) {
            if (isGameOver) {
                continueGame();
                return;
            }
            if (!isARActive) return;

            startChargingFrisbee();
        }

        function onXRSelectEnd(event) {
            if (!isCharging) return;
            isCharging = false;
            releaseXRFrisbee();
        }

        function startChargingFrisbee() {
            isCharging = true;
            currentPower = 0;
            powerDirection = 1;
            xrFrisbeeActive = false;
            frisbeeMesh.visible = true;
            updatePowerMeter(0);
            chargeLoop();
        }

        function releaseXRFrisbee() {
            const isHit = Math.abs(currentPower - targetPower) <= tolerance;
            xrFrisbeeActive = true;
            xrTargetAim = currentWebXRTarget;
            
            const startPos = frisbeeMesh.position.clone();
            let endPos;
            
            if (isHit && xrTargetAim) {
                endPos = xrTargetAim.position.clone();
            } else {
                // Miss trajectory - aim over the target and deep into the distance
                const xrCam = renderer.xr.getCamera(camera);
                const camDir = new THREE.Vector3();
                xrCam.getWorldDirection(camDir);
                camDir.y += 0.3; 
                const camPos = new THREE.Vector3();
                xrCam.getWorldPosition(camPos);
                endPos = camPos.add(camDir.multiplyScalar(5));
            }
            
            // Calculate physical velocity vector and shoot it out
            xrFrisbeeVelocity.subVectors(endPos, startPos).normalize().multiplyScalar(0.06); 
            
            randomizeTarget();
            updatePowerMeter(0);
            currentPower = 0;
        }

        function renderXR(timestamp, frame) {
            if (!frame || !xrSession) return;

            const xrCam = renderer.xr.getCamera(camera);

            // Request Hit-Test Source inside the active XR frame loop
            if (!hitTestSourceRequested && xrSession.requestHitTestSource) {
                hitTestSourceRequested = true;
                xrSession.requestReferenceSpace('viewer').then((viewerSpace) => {
                    xrViewerSpace = viewerSpace;
                    return xrSession.requestHitTestSource({ space: xrViewerSpace });
                }).then((source) => {
                    xrHitTestSource = source;
                }).catch(() => {
                    console.warn("Hit-test source unavailable; using spatial target placement.");
                });
            }

            // Spawn target via Hit-Test (surface scanning) or Spatial Fallback
            if (activeTargets.length < 1 && xrRefSpace) {
                if (xrHitTestSource) {
                    const hitTestResults = frame.getHitTestResults(xrHitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(xrRefSpace);
                        if (pose) {
                            const hitPosition = new THREE.Vector3(
                                pose.transform.position.x,
                                pose.transform.position.y,
                                pose.transform.position.z
                            );
                            
                            const camPos = new THREE.Vector3();
                            xrCam.getWorldPosition(camPos);

                            // Check if surface hit is within 3 feet (~0.9144 meters) of XR camera
                            const distance = camPos.distanceTo(hitPosition);
                            if (distance <= 0.9144) {
                                // Ensure target spawns in the middle vertical band between top and bottom UI
                                const vec = hitPosition.clone().project(xrCam);
                                if (vec.y > -0.6 && vec.y < 0.6) {
                                    spawnTargetOnSurface(pose.transform);
                                }
                            }
                        }
                    }
                } else {
                    // Spatial Fallback for XR Viewers without raw surface hit-testing
                    spawnSpatialTargetInView(xrCam);
                }
            }

            // Frisbee Physics and 3D Collision Logic
            if (xrFrisbeeActive) {
                frisbeeMesh.position.add(xrFrisbeeVelocity);
                frisbeeMesh.rotation.y += 0.5;
                frisbeeMesh.rotation.z = Math.sin(Date.now() * 0.01) * 0.1; 
                
                // 3D Collider Hit Check
                if (xrTargetAim) {
                    const dist = frisbeeMesh.position.distanceTo(xrTargetAim.position);
                    if (dist < 0.22) {
                        xrFrisbeeActive = false;
                        frisbeeMesh.visible = false;
                        
                        const hitTarget = xrTargetAim;
                        
                        // Project 3D hit coordinates to 2D screen space for DOM score popup
                        const vec = new THREE.Vector3();
                        vec.setFromMatrixPosition(hitTarget.matrixWorld);
                        vec.project(xrCam);
                        const px = (vec.x * 0.5 + 0.5) * window.innerWidth;
                        const py = (-(vec.y * 0.5) + 0.5) * window.innerHeight;
                        showPlusOnePoint(px, py);

                        const visibleRings = hitTarget.children.filter(c => c.name.startsWith('ring_') && c.visible);
                        if (visibleRings.length > 0) {
                            const ringToRemove = visibleRings[0];
                            ringToRemove.material.color.setHex(0x74ED63);
                            
                            setTimeout(() => {
                                ringToRemove.visible = false;
                                if (visibleRings.length === 1) {
                                    scene.remove(hitTarget);
                                    activeTargets = activeTargets.filter(t => t !== hitTarget);
                                    if (currentWebXRTarget === hitTarget) currentWebXRTarget = null;
                                }
                            }, 400);
                        }
                    }
                }
                
                // Miss boundary check
                const camPos = new THREE.Vector3();
                xrCam.getWorldPosition(camPos);
                if (camPos.distanceTo(frisbeeMesh.position) > 5) {
                    xrFrisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleMiss();
                }
                
            } else if (isCharging) {
                // Hold and pull back the 3D frisbee relative to the XR camera/viewer
                const camDir = new THREE.Vector3();
                xrCam.getWorldDirection(camDir);
                const camPos = new THREE.Vector3();
                xrCam.getWorldPosition(camPos);
                
                const pullBack = (currentPower / 100) * 0.2;
                const offset = camDir.clone().multiplyScalar(0.4 - pullBack);
                offset.y -= 0.15;
                
                frisbeeMesh.position.copy(camPos).add(offset);
                frisbeeMesh.quaternion.copy(xrCam.quaternion);
                frisbeeMesh.rotateX(Math.PI / 2 - 0.2); 
            }

            // Update active targets and pick the closest one to gaze center
            if (activeTargets.length > 0) {
                let closestDist = Infinity;
                let closestT = null;

                activeTargets.forEach(t => {
                    t.rotation.x += 0.005;
                    t.rotation.y += 0.008;

                    const vec = new THREE.Vector3();
                    vec.setFromMatrixPosition(t.matrixWorld);
                    vec.project(xrCam);
                    
                    const left = (vec.x * 0.5 + 0.5) * 100;
                    const top = (-(vec.y * 0.5) + 0.5) * 100;
                    const dist = Math.hypot(left - 50, top - 50);

                    if (vec.z < 1 && dist < closestDist) {
                        closestDist = dist;
                        closestT = t;
                    }
                });

                if (closestT) {
                    currentWebXRTarget = closestT;
                }
            }

            renderer.render(scene, camera);
        }

        function spawnTargetOnSurface(transform) {
            const clone = targetTemplateMesh.clone();
            clone.children.forEach(child => {
                if (child.name.startsWith("ring_")) {
                    child.material = child.material.clone();
                }
            });
            clone.visible = true;

            clone.position.copy(transform.position);
            clone.quaternion.copy(transform.orientation);
            clone.rotateX(Math.PI / 2);
            
            scene.add(clone);
            activeTargets.push(clone);
        }

        function spawnSpatialTargetInView(xrCam) {
            const clone = targetTemplateMesh.clone();
            clone.children.forEach(child => {
                if (child.name.startsWith("ring_")) {
                    child.material = child.material.clone();
                }
            });
            clone.visible = true;

            const camDir = new THREE.Vector3();
            xrCam.getWorldDirection(camDir);
            const camPos = new THREE.Vector3();
            xrCam.getWorldPosition(camPos);

            const spawnPos = camPos.clone().add(camDir.multiplyScalar(0.76));
            spawnPos.x += (Math.random() - 0.5) * 0.4;
            spawnPos.y += (Math.random() - 0.5) * 0.25;

            clone.position.copy(spawnPos);
            clone.lookAt(camPos);

            scene.add(clone);
            activeTargets.push(clone);
        }

        // --- UI & Power Meter Mechanics ---
        const trackLeft = document.querySelector('.slider-track-left');
        const trackRight = document.querySelector('.slider-track-right');
        const targetLineElement = document.getElementById('target-line');
        
        function showPlusOnePoint(x, y) {
            if (isHeadsetViewer) return; // DOM overlay isn't visible on headset-only viewers
            const popup = document.getElementById('score-popup');
            popup.style.display = 'block';
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, -50%)';
            
            void popup.offsetWidth;
            popup.style.transform = 'translate(-50%, calc(-50% - 2px))';
            
            setTimeout(() => {
                popup.style.opacity = '0';
            }, 1000);
            
            setTimeout(() => {
                if (popup.style.opacity === '0') popup.style.display = 'none';
            }, 1500);
        }

        function handleMiss() {
            misses++;
            if (misses >= 20) {
                isGameOver = true;
                document.getElementById('continue-overlay').style.display = 'flex';
            }
        }

        function continueGame() {
            misses = 0;
            isGameOver = false;
            document.getElementById('continue-overlay').style.display = 'none';
        }

        function randomizeTarget() {
            targetPower = 20 + Math.random() * 70;
            targetLineElement.style.left = `${targetPower}%`;

            if (hudTargetLineMesh) {
                hudTargetLineMesh.position.x = -0.11 + (targetPower / 100) * 0.22;
            }
        }

        function updatePowerMeter(powerPercent) {
            trackLeft.style.width = `${powerPercent}%`;
            trackRight.style.width = `${100 - powerPercent}%`;

            if (hudFillMesh) {
                const ratio = Math.max(0.001, powerPercent / 100);
                hudFillMesh.scale.x = ratio;
                hudFillMesh.position.x = -0.11 + (ratio * 0.22) / 2;
            }
        }

        // Set initial target line position
        randomizeTarget();

        function chargeLoop() {
            if (!isCharging) return;
            
            currentPower += chargeSpeed * powerDirection;
            
            if (currentPower >= 100) {
                currentPower = 100;
                powerDirection = -1;
            } else if (currentPower <= 0) {
                currentPower = 0;
                powerDirection = 1;
            }
            
            updatePowerMeter(currentPower);
            requestAnimationFrame(chargeLoop);
        }

        // Touch screen input via WebXR DOM Overlay (Mobile AR)
        window.addEventListener('pointerdown', (e) => {
            if (isGameOver || !isARActive || e.target.closest('.interactive-element')) return;
            startChargingFrisbee();
        });

        window.addEventListener('pointerup', () => {
            if (!isCharging) return;
            isCharging = false;
            releaseXRFrisbee();
        });
    </script>
</body>
</html>
