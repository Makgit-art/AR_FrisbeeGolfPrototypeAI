<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - 3D Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Shrikhand', Georgia, serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Live Camera Video Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 36px 20px 56px 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 28px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .banner-text-bg {
            -webkit-text-stroke: 8px #8B5CF6;
            color: #8B5CF6;
        }

        /* Center Start / Continue Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 14px 40px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            opacity: 1;
            position: relative;
            z-index: 300;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: opacity 0.35s ease-in-out, transform 0.1s ease;
        }

        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 8px #246B3E;
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
            box-sizing: border-box;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 10px;
            width: 0%;
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            flex: 1;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            border: 1px solid black;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        @keyframes pulse {
            0% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
            50% { border-color: rgba(116, 237, 99, 0.35); box-shadow: 0 0 10px rgba(116, 237, 99, 0.15); }
            100% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0; pointer-events: none;">
            <div class="text-outline-wrapper text-3xl sm:text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Start Button -->
        <button id="scan-btn" type="button" class="scan-button interactive-element">
            <div class="text-outline-wrapper text-3xl sm:text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Start Game</span>
                <span class="text-outline-fg">Start Game</span>
            </div>
        </button>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; left: 50%; top: 45%; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1.5px black; z-index: 150; pointer-events: none; transition: transform 0.6s ease-out, opacity 0.6s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 250; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button id="continue-btn" type="button" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Simulated Image Scanner UI -->
        <div id="scanner-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">
            <div id="scanner-frame" style="border: 4px dashed #74ED63; width: 220px; height: 220px; border-radius: 16px; position: relative; animation: pulse 2s infinite; pointer-events: auto; cursor: pointer;">
                <div style="position: absolute; top: -40px; left: 0; width: 100%; text-align: center; color: #74ED63; font-weight: bold; font-family: sans-serif; font-size: 1.15rem; text-shadow: 2px 2px 4px black;">SCANNING RETICLE...</div>
                <div style="position: absolute; bottom: -46px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 0.85rem; text-shadow: 1px 1px 2px black;">Align scannable image (or tap frame)</div>
            </div>

            <!-- Reference Image for the User -->
            <div style="position: absolute; bottom: 110px; right: 20px; display: flex; flex-direction: column; align-items: center;">
                <span style="color: white; font-family: sans-serif; font-size: 0.75rem; text-shadow: 1px 1px 2px black; margin-bottom: 5px;">Target Marker</span>
                <img id="reticle-ref-img" src="Scannable_Reticle.png" alt="Reticle Reference" style="width: 76px; height: 76px; border: 2px solid white; border-radius: 10px; background: rgba(255, 255, 255, 0.9); object-fit: contain;" onerror="this.style.display='none'; document.getElementById('reticle-svg-fallback').style.display='block';">
                <svg id="reticle-svg-fallback" viewBox="0 0 100 100" style="display: none; width: 76px; height: 76px; border: 2px solid white; border-radius: 10px; background: white;">
                    <circle cx="50" cy="50" r="42" fill="none" stroke="#999" stroke-width="2.5"/>
                    <circle cx="50" cy="50" r="36" fill="none" stroke="#999" stroke-width="2"/>
                    <circle cx="50" cy="50" r="31" fill="#1a1a1a"/>
                    <path d="M32 66 V34 H37 L42 46 L47 34 H52 V66 H47 V45 L42 54 L37 45 V66 Z" fill="#bbb"/>
                    <polygon points="58,34 76,50 58,66" fill="#bbb"/>
                </svg>
            </div>
        </div>

        <!-- Bottom Power Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0; pointer-events: none;">
            <div class="slider-end-mark"></div>
            <div class="slider-track-container mx-1">
                <div class="slider-track-left" id="power-fill"></div>
                <div class="slider-track-right"></div>
                <div class="slider-target-line" id="target-line"></div>
            </div>
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isGameActive = false;
        let hasGameStarted = false;
        let isScanningMarker = false;
        let scanTimeoutId = null;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        const chargeSpeed = 95; // Percentage per second
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for a successful throw

        let misses = 0;
        let score = 0;
        let isGameOver = false;

        // Three.js Variables
        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentTarget = null;
        let environmentGroup;
        let controls = null; // Visual-Inertial Tracker
        let lastTime = 0;

        // 3D Park Diorama Dimensions (8.5" x 11" footprint in meters)
        const DIORAMA_WIDTH_M = 0.2159;  // 8.5 inches
        const DIORAMA_DEPTH_M = 0.2794;  // 11.0 inches

        // 3D Frisbee Variables
        let frisbeeMesh = null;
        let frisbeeActive = false;
        let frisbeeVelocity = new THREE.Vector3();
        let frisbeeFlightTime = 0;
        let frisbeeWillHit = false;
        let frisbeeTargetPoint = new THREE.Vector3();

        // Desktop / Fallback Camera Look Variables
        let isPointerDown = false;
        let lastPointerPos = { x: 0, y: 0 };
        let cameraYaw = 0;
        let cameraPitch = 0;

        // Start rear camera feed without blocking UI
        async function startCameraFeed() {
            const video = document.getElementById('camera-feed');
            if (!video || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            try {
                video.setAttribute('playsinline', '');
                video.muted = true;
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                video.srcObject = stream;
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch((err) => console.warn('Video autoplay deferred:', err));
                }
            } catch (err) {
                console.warn('Camera feed unavailable or permission denied:', err);
            }
        }

        // Main entry point triggered by tapping or clicking "Start Game"
        async function startGame(e) {
            if (e) {
                e.stopPropagation();
            }
            if (hasGameStarted) return;
            hasGameStarted = true;

            const button = document.getElementById('scan-btn');
            if (button) {
                button.style.transform = 'scale(0.92)';
                button.style.opacity = '0';
                button.style.pointerEvents = 'none';
                setTimeout(() => {
                    button.style.display = 'none';
                }, 250);
            }

            // Request iOS 13+ DeviceOrientation permission directly inside user gesture
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        console.warn('Device orientation permission not granted.');
                    }
                } catch (error) {
                    console.warn('Device orientation permission request skipped:', error);
                }
            }

            // Initialize Three.js scene and begin reticle scanning immediately
            try {
                if (!renderer) {
                    initThreeJS();
                }
                isGameActive = true;
                startScanningForReticle();
            } catch (err) {
                console.error('Error initializing Three.js game:', err);
                hasGameStarted = false;
                if (button) {
                    button.style.display = 'block';
                    button.style.opacity = '1';
                    button.style.pointerEvents = 'auto';
                }
                return;
            }

            // Start live camera feed asynchronously so mobile permission dialogs don't stall startup
            startCameraFeed();
        }

        function startScanningForReticle() {
            isScanningMarker = true;
            const scannerUI = document.getElementById('scanner-ui');
            if (scannerUI) {
                scannerUI.style.display = 'flex';
            }

            if (scanTimeoutId) clearTimeout(scanTimeoutId);
            scanTimeoutId = setTimeout(() => {
                finishScanningAndSpawn();
            }, 2200);
        }

        function finishScanningAndSpawn() {
            if (!isScanningMarker) return;
            isScanningMarker = false;
            if (scanTimeoutId) {
                clearTimeout(scanTimeoutId);
                scanTimeoutId = null;
            }

            const scannerUI = document.getElementById('scanner-ui');
            if (scannerUI) {
                scannerUI.style.display = 'none';
            }

            const topBanner = document.getElementById('top-banner');
            const bottomSlider = document.getElementById('bottom-slider');
            if (topBanner) {
                topBanner.style.opacity = '1';
                topBanner.style.pointerEvents = 'auto';
            }
            if (bottomSlider) {
                bottomSlider.style.opacity = '1';
                bottomSlider.style.pointerEvents = 'auto';
            }

            randomizeTargetLine();
            spawnTargetOnReticle();
        }

        function initThreeJS() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = null; // Transparent so live camera feed shows through

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
            camera.position.set(0, 1.4, 0); // Eye level
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting matching the park reference shots
            const hemiLight = new THREE.HemisphereLight(0xfff5ec, 0x261712, 0.78);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffaf0, 1.35);
            dirLight.position.set(1.8, 4.5, 2.2);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.bias = -0.0005;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xd8e2ff, 0.35);
            fillLight.position.set(-2.0, 1.5, -2.0);
            scene.add(fillLight);

            environmentGroup = new THREE.Group();
            scene.add(environmentGroup);

            // Visual-Inertial Tracking via DeviceOrientationControls
            if (typeof THREE.DeviceOrientationControls === 'function') {
                try {
                    controls = new THREE.DeviceOrientationControls(camera);
                } catch (err) {
                    console.warn('DeviceOrientationControls failed to initialize:', err);
                }
            }

            // Build the 3D Park Environment + Recessed Light-Blue Portal Cavity + Invisible Occluder Box
            buildTargetTemplate();

            // Build Blender-Style 3D Frisbee
            buildFrisbeeMesh();

            window.addEventListener('resize', onWindowResize);
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#5c9436';
            ctx.fillRect(0, 0, 256, 256);

            const palette = ['#7eb84c', '#98cc64', '#427326', '#2e5718', '#b0db7d', '#548731'];
            for (let i = 0; i < 4200; i++) {
                ctx.fillStyle = palette[Math.floor(Math.random() * palette.length)];
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const w = 1.5 + Math.random() * 3.5;
                const h = 1.5 + Math.random() * 4.5;
                ctx.fillRect(x, y, w, h);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2.6);
            return tex;
        }

        function createBranchTube(pointsArr, radiusBottom, radiusTop, material) {
            const curve = new THREE.CatmullRomCurve3(pointsArr);
            const segs = 12;
            const radSegs = 8;
            const geom = new THREE.TubeGeometry(curve, segs, radiusBottom, radSegs, false);

            // Taper tube radius along length from radiusBottom to radiusTop
            const pos = geom.attributes.position;
            const v = new THREE.Vector3();
            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const center = curve.getPointAt(t);
                const scale = THREE.MathUtils.lerp(1.0, radiusTop / radiusBottom, t);
                for (let j = 0; j <= radSegs; j++) {
                    const idx = i * (radSegs + 1) + j;
                    v.fromBufferAttribute(pos, idx);
                    v.sub(center).multiplyScalar(scale).add(center);
                    pos.setXYZ(idx, v.x, v.y, v.z);
                }
            }
            geom.computeVertexNormals();
            const mesh = new THREE.Mesh(geom, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        function addLeafCluster(parentGroup, clusters) {
            // Leaf-card geometry (diamond-like angled blade)
            const leafShape = new THREE.Shape();
            leafShape.moveTo(0, 0);
            leafShape.quadraticCurveTo(0.0042, 0.0045, 0, 0.0115);
            leafShape.quadraticCurveTo(-0.0042, 0.0045, 0, 0);
            const leafGeom = new THREE.ShapeGeometry(leafShape);

            const leafMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.85,
                metalness: 0.05,
                side: THREE.DoubleSide
            });

            let totalLeaves = 0;
            clusters.forEach((c) => { totalLeaves += c.count; });

            const instancedLeaves = new THREE.InstancedMesh(leafGeom, leafMat, totalLeaves);
            instancedLeaves.castShadow = true;
            instancedLeaves.receiveShadow = true;

            const dummy = new THREE.Object3D();
            const color = new THREE.Color();
            const topColor = new THREE.Color(0xe6c8be);     // Dusty cream-pink top highlights
            const midColor = new THREE.Color(0xb88f84);     // Warm dusty rose
            const darkColor = new THREE.Color(0x3a2018);    // Deep brown shaded undersides

            let idx = 0;
            clusters.forEach((c) => {
                for (let i = 0; i < c.count; i++) {
                    // Distribute leaves around spherical cluster volume
                    const u = Math.random();
                    const v = Math.random();
                    const theta = u * 2.0 * Math.PI;
                    const phi = Math.acos(2.0 * v - 1.0);
                    const r = c.radius * (0.35 + 0.65 * Math.cbrt(Math.random()));

                    const lx = r * Math.sin(phi) * Math.cos(theta);
                    const ly = r * Math.cos(phi) * 0.92;
                    const lz = r * Math.sin(phi) * Math.sin(theta);

                    dummy.position.set(c.x + lx, c.y + ly, c.z + lz);
                    dummy.rotation.set(
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2,
                        Math.random() * Math.PI * 2
                    );
                    const s = 0.75 + Math.random() * 0.65;
                    dummy.scale.set(s, s, s);
                    dummy.updateMatrix();
                    instancedLeaves.setMatrixAt(idx, dummy.matrix);

                    // Shade top leaves lighter and underside leaves deep brown like reference shots
                    const heightNorm = THREE.MathUtils.clamp((ly / c.radius + 1) * 0.5, 0, 1);
                    if (heightNorm > 0.55) {
                        color.copy(midColor).lerp(topColor, (heightNorm - 0.55) / 0.45);
                    } else {
                        color.copy(darkColor).lerp(midColor, heightNorm / 0.55);
                    }
                    instancedLeaves.setColorAt(idx, color);
                    idx++;
                }
            });

            instancedLeaves.instanceMatrix.needsUpdate = true;
            if (instancedLeaves.instanceColor) instancedLeaves.instanceColor.needsUpdate = true;
            parentGroup.add(instancedLeaves);
        }

        function buildTargetTemplate() {
            targetTemplateMesh = new THREE.Group();
            targetTemplateMesh.name = 'park-portal-root';

            const parkContentGroup = new THREE.Group();
            parkContentGroup.name = 'park-diorama-content';

            const grassW = DIORAMA_WIDTH_M;
            const grassD = DIORAMA_DEPTH_M;
            const grassH = 0.008;

            // 1. Rectangular Mottled Grass Base
            const grassTex = createGrassTexture();
            const grassMat = new THREE.MeshStandardMaterial({
                map: grassTex,
                roughness: 0.92,
                metalness: 0.02
            });
            const grassMesh = new THREE.Mesh(new THREE.BoxGeometry(grassW, grassH, grassD), grassMat);
            grassMesh.position.set(0, grassH / 2, 0);
            grassMesh.receiveShadow = true;
            parkContentGroup.add(grassMesh);

            // Pale back-edge border strip seen in back/45-degree views
            const trimMat = new THREE.MeshStandardMaterial({ color: 0xe8ece0, roughness: 0.85 });
            const backTrim = new THREE.Mesh(new THREE.BoxGeometry(grassW, grassH * 1.05, 0.006), trimMat);
            backTrim.position.set(0, grassH / 2, -grassD / 2 + 0.003);
            parkContentGroup.add(backTrim);

            // 2. Curved Off-White Pathway (sweeps from mid-left to front-center to mid-right)
            const pathMat = new THREE.MeshStandardMaterial({
                color: 0xe6e4dc,
                roughness: 0.82,
                metalness: 0.02
            });
            const pathCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-grassW * 0.48, 0, grassD * 0.02),
                new THREE.Vector3(-grassW * 0.28, 0, grassD * 0.24),
                new THREE.Vector3(grassW * 0.04, 0, grassD * 0.29),
                new THREE.Vector3(grassW * 0.30, 0, grassD * 0.16),
                new THREE.Vector3(grassW * 0.49, 0, -grassD * 0.05)
            ]);
            const pathPoints = pathCurve.getPoints(32);
            const pathHalfW = 0.017;
            const pathShape = new THREE.Shape();
            const leftPts = [];
            const rightPts = [];
            for (let i = 0; i < pathPoints.length; i++) {
                const p = pathPoints[i];
                const tangent = pathCurve.getTangent(i / (pathPoints.length - 1));
                const normal = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
                leftPts.push(new THREE.Vector2(p.x + normal.x * pathHalfW, -(p.z + normal.z * pathHalfW)));
                rightPts.push(new THREE.Vector2(p.x - normal.x * pathHalfW, -(p.z - normal.z * pathHalfW)));
            }
            pathShape.moveTo(leftPts[0].x, leftPts[0].y);
            for (let i = 1; i < leftPts.length; i++) pathShape.lineTo(leftPts[i].x, leftPts[i].y);
            for (let i = rightPts.length - 1; i >= 0; i--) pathShape.lineTo(rightPts[i].x, rightPts[i].y);
            pathShape.closePath();

            const pathGeom = new THREE.ExtrudeGeometry(pathShape, { depth: 0.0025, bevelEnabled: false });
            pathGeom.rotateX(-Math.PI / 2);
            const pathMesh = new THREE.Mesh(pathGeom, pathMat);
            pathMesh.position.y = grassH + 0.0005;
            pathMesh.receiveShadow = true;
            parkContentGroup.add(pathMesh);

        function buildFrisbeeMesh() {
            // Blender-style LatheGeometry glossy 3D frisbee
            const points = [
                new THREE.Vector2(0.0, 0.011),
                new THREE.Vector2(0.025, 0.0105),
                new THREE.Vector2(0.055, 0.008),
                new THREE.Vector2(0.072, 0.003),
                new THREE.Vector2(0.078, -0.006),
                new THREE.Vector2(0.074, -0.010),
                new THREE.Vector2(0.068, -0.007),
                new THREE.Vector2(0.062, 0.002),
                new THREE.Vector2(0.030, 0.005),
                new THREE.Vector2(0.0, 0.006)
            ];
            const geom = new THREE.LatheGeometry(points, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: 0xff3b5c,
                roughness: 0.22,
                metalness: 0.15
            });
            frisbeeMesh = new THREE.Mesh(geom, mat);
            frisbeeMesh.castShadow = true;
            frisbeeMesh.visible = false;
            frisbeeMesh.renderOrder = 2;
            scene.add(frisbeeMesh);
        }

        function spawnTargetOnReticle() {
            if (!targetTemplateMesh || activeTargets.length >= 1) return;

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const scanPos = camera.position.clone().addScaledVector(forward, 0.9144); // 3 feet away
            scanPos.y -= DIORAMA_DEPTH_M / 2; // Center the 8.5" x 11" front opening on the reticle

            const targetClone = targetTemplateMesh.clone();
            targetClone.position.copy(scanPos);

            const toCamX = camera.position.x - scanPos.x;
            const toCamZ = camera.position.z - scanPos.z;
            targetClone.rotation.set(0, Math.atan2(toCamX, toCamZ), 0);

            targetClone.userData.hitsRemaining = 3;

            scene.add(targetClone);
            activeTargets.push(targetClone);
            currentTarget = targetClone;
        }

        function randomizeTargetLine() {
            targetPower = 20 + Math.random() * 60; // Between 20% and 80%
            const targetLine = document.getElementById('target-line');
            if (targetLine) {
                targetLine.style.left = `${targetPower}%`;
            }
        }

        function updatePowerBarUI() {
            const fill = document.getElementById('power-fill');
            if (fill) {
                fill.style.width = `${currentPower}%`;
            }
        }

        function startCharging() {
            if (!isGameActive || isScanningMarker || isGameOver || frisbeeActive) return;
            isCharging = true;
            currentPower = 0;
            powerDirection = 1;
            updatePowerBarUI();
        }

        function releaseThrow() {
            if (!isCharging) return;
            isCharging = false;

            const diff = Math.abs(currentPower - targetPower);
            const isPerfect = diff <= tolerance;
            throwFrisbee(isPerfect);

            currentPower = 0;
            updatePowerBarUI();
        }

        function throwFrisbee(isHit) {
            if (!frisbeeMesh || !camera) return;

            const startPos = camera.position.clone();
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const down = new THREE.Vector3(0, -1, 0).applyQuaternion(camera.quaternion);
            startPos.addScaledVector(forward, 0.25).addScaledVector(down, 0.14);

            frisbeeMesh.position.copy(startPos);
            frisbeeMesh.rotation.set(0.15, 0, 0);
            frisbeeMesh.visible = true;
            frisbeeActive = true;
            frisbeeFlightTime = 0;
            frisbeeWillHit = isHit;

            // Aim straight at the purple disc golf basket inside the portal if hit, else veer wide
            if (currentTarget) {
                const basket = currentTarget.getObjectByName('disc-golf-basket');
                if (basket) {
                    basket.getWorldPosition(frisbeeTargetPoint);
                    frisbeeTargetPoint.y += 0.025;
                } else {
                    frisbeeTargetPoint.copy(currentTarget.position);
                    frisbeeTargetPoint.y += DIORAMA_DEPTH_M * 0.45;
                }
            } else {
                frisbeeTargetPoint.copy(camera.position).addScaledVector(forward, 1.2);
            }

            if (!isHit) {
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                const missSide = Math.random() > 0.5 ? 1 : -1;
                frisbeeTargetPoint.addScaledVector(right, missSide * 0.35);
                frisbeeTargetPoint.y += (Math.random() - 0.3) * 0.25;
            }

            const flightDir = new THREE.Vector3().subVectors(frisbeeTargetPoint, startPos).normalize();
            frisbeeVelocity.copy(flightDir).multiplyScalar(2.6);
        }

        function showScorePopup() {
            const popup = document.getElementById('score-popup');
            if (!popup) return;
            popup.style.display = 'block';
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, -50%) scale(1)';

            requestAnimationFrame(() => {
                popup.style.transform = 'translate(-50%, -130%) scale(1.15)';
                popup.style.opacity = '0';
            });

            setTimeout(() => {
                popup.style.display = 'none';
            }, 650);
        }

        function handleMiss() {
            misses++;
            if (misses >= 20) {
                isGameOver = true;
                const overlay = document.getElementById('continue-overlay');
                if (overlay) {
                    overlay.style.display = 'flex';
                }
            }
        }

        function continueGame(e) {
            if (e) e.stopPropagation();
            misses = 0;
            isGameOver = false;
            const overlay = document.getElementById('continue-overlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
            randomizeTargetLine();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Update Power Slider Charge
            if (isCharging) {
                currentPower += powerDirection * chargeSpeed * dt;
                if (currentPower >= 100) {
                    currentPower = 100;
                    powerDirection = -1;
                } else if (currentPower <= 0) {
                    currentPower = 0;
                    powerDirection = 1;
                }
                updatePowerBarUI();
            }

            // Visual-Inertial Tracking + Subtle Parallax Shift for Recessed Depth Illusion
            if (controls && controls.deviceOrientation && controls.deviceOrientation.alpha !== null) {
                controls.update();
                if (currentTarget) {
                    const lookDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    const toTarget = new THREE.Vector3().subVectors(currentTarget.position, new THREE.Vector3(0, 1.4, 0)).normalize();
                    const parallaxX = THREE.MathUtils.clamp((lookDir.x - toTarget.x) * 0.25, -0.16, 0.16);
                    const parallaxY = THREE.MathUtils.clamp((lookDir.y - toTarget.y) * 0.20, -0.12, 0.12);
                    camera.position.x = THREE.MathUtils.lerp(camera.position.x, parallaxX, 0.12);
                    camera.position.y = THREE.MathUtils.lerp(camera.position.y, 1.4 + parallaxY, 0.12);
                }
            } else if (camera) {
                camera.rotation.y = cameraYaw;
                camera.rotation.x = cameraPitch;
                camera.position.x = -Math.sin(cameraYaw) * 0.32;
                camera.position.y = 1.4 + Math.sin(cameraPitch) * 0.22;
            }

            // Update 3D Frisbee Flight & Scoring
            if (frisbeeActive && frisbeeMesh) {
                frisbeeFlightTime += dt;
                frisbeeMesh.position.addScaledVector(frisbeeVelocity, dt);
                frisbeeMesh.rotation.y += 18 * dt;

                const distToTarget = frisbeeMesh.position.distanceTo(frisbeeTargetPoint);
                if (frisbeeWillHit && distToTarget < 0.09) {
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    score++;
                    showScorePopup();
                    randomizeTargetLine();
                } else if (frisbeeFlightTime > 0.9) {
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    if (frisbeeWillHit) {
                        score++;
                        showScorePopup();
                        randomizeTargetLine();
                    } else {
                        handleMiss();
                    }
                }
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // Bind Mobile-Safe Button & Gameplay Input Listeners once DOM is ready
        window.addEventListener('DOMContentLoaded', () => {
            const scanBtn = document.getElementById('scan-btn');
            const continueBtn = document.getElementById('continue-btn');
            const scannerFrame = document.getElementById('scanner-frame');

            if (scanBtn) {
                scanBtn.addEventListener('click', startGame);
                scanBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    startGame(e);
                }, { passive: false });
            }

            if (continueBtn) {
                continueBtn.addEventListener('click', continueGame);
                continueBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    continueGame(e);
                }, { passive: false });
            }

            if (scannerFrame) {
                scannerFrame.addEventListener('click', finishScanningAndSpawn);
                scannerFrame.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    finishScanningAndSpawn();
                }, { passive: false });
            }

            // Touch Controls for Charging & Throwing Frisbee (only active after scanning finishes)
            window.addEventListener('touchstart', (e) => {
                if (!isGameActive || isScanningMarker || isGameOver) return;
                if (e.target.closest('button')) return;
                isPointerDown = true;
                lastPointerPos.x = e.touches[0].clientX;
                lastPointerPos.y = e.touches[0].clientY;
                startCharging();
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isPointerDown || !isGameActive || isScanningMarker || isGameOver) return;
                if (!controls || !controls.deviceOrientation || controls.deviceOrientation.alpha === null) {
                    const dx = e.touches[0].clientX - lastPointerPos.x;
                    const dy = e.touches[0].clientY - lastPointerPos.y;
                    cameraYaw = THREE.MathUtils.clamp(cameraYaw - dx * 0.004, -0.7, 0.7);
                    cameraPitch = THREE.MathUtils.clamp(cameraPitch - dy * 0.004, -0.45, 0.45);
                    lastPointerPos.x = e.touches[0].clientX;
                    lastPointerPos.y = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (!isPointerDown) return;
                isPointerDown = false;
                if (!isGameActive || isScanningMarker || isGameOver) return;
                releaseThrow();
            }, { passive: true });

            // Mouse Controls for Desktop Testing
            window.addEventListener('mousedown', (e) => {
                if (!isGameActive || isScanningMarker || isGameOver) return;
                if (e.target.closest('button')) return;
                isPointerDown = true;
                lastPointerPos.x = e.clientX;
                lastPointerPos.y = e.clientY;
                startCharging();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isPointerDown || !isGameActive || isScanningMarker || isGameOver) return;
                const dx = e.clientX - lastPointerPos.x;
                const dy = e.clientY - lastPointerPos.y;
                cameraYaw = THREE.MathUtils.clamp(cameraYaw - dx * 0.004, -0.7, 0.7);
                cameraPitch = THREE.MathUtils.clamp(cameraPitch - dy * 0.004, -0.45, 0.45);
                lastPointerPos.x = e.clientX;
                lastPointerPos.y = e.clientY;
            });

            window.addEventListener('mouseup', () => {
                if (!isPointerDown) return;
                isPointerDown = false;
                if (!isGameActive || isScanningMarker || isGameOver) return;
                releaseThrow();
            });
        });
    </script>
</body>
