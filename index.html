<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - 3D Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Shrikhand', Georgia, serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Live Camera Video Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 60px 20px;
            pointer-events: none; /* Let touches pass through to Three.js scene */
        }

        /* Make specific UI elements interactive */
        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .banner-text-bg {
            -webkit-text-stroke: 10px #8B5CF6; /* Purple outline */
            color: #8B5CF6;
        }

        /* Center Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 12px 40px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s ease-in-out, transform 0.1s;
        }
        
        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 10px #246B3E; /* Dark green outline */
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            pointer-events: auto;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 8px;
            width: 0%;
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            width: 100%;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0;">
            <div class="text-outline-wrapper text-4xl sm:text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Start Button -->
        <button id="scan-btn" class="scan-button interactive-element" onclick="startGame()">
            <div class="text-outline-wrapper text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Start Game</span>
                <span class="text-outline-fg">Start Game</span>
            </div>
        </button>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1px black; z-index: 150; pointer-events: none; transition: transform 0.5s ease-out, opacity 0.5s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 200; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button onclick="continueGame()" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Simulated Image Scanner UI -->
        <div id="scanner-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">
            <div style="border: 4px dashed #74ED63; width: 250px; height: 250px; border-radius: 20px; position: relative; box-shadow: 0 0 20px rgba(116, 237, 99, 0.3); animation: pulse 2s infinite;">
                <div style="position: absolute; top: -40px; left: 0; width: 100%; text-align: center; color: #74ED63; font-weight: bold; font-family: sans-serif; font-size: 1.2rem; text-shadow: 2px 2px 4px black; -webkit-text-stroke: 1px black;">SCANNING...</div>
                <div style="position: absolute; bottom: -40px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 0.9rem; text-shadow: 1px 1px 2px black;">Align marker in view</div>
            </div>
            
            <!-- Reference Image for the User -->
            <div style="position: absolute; bottom: 100px; right: 20px; display: flex; flex-direction: column; align-items: center;">
                <span style="color: white; font-family: sans-serif; font-size: 0.8rem; text-shadow: 1px 1px 2px black; margin-bottom: 5px;">Target Marker</span>
                <img src="Scannable_Reticle.png" alt="Reticle Reference" style="width: 80px; height: 80px; border: 2px solid white; border-radius: 10px; background: rgba(0,0,0,0.5); object-fit: contain;">
            </div>
        </div>

        <style>
            @keyframes pulse {
                0% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
                50% { border-color: rgba(116, 237, 99, 0.3); box-shadow: 0 0 10px rgba(116, 237, 99, 0.1); }
                100% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
            }
        </style>

        <!-- Bottom Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0;">
            <div class="slider-end-mark"></div>
            <div class="slider-track-container mx-1">
                <div class="slider-track-left"></div>
                <div class="slider-track-right"></div>
                <div class="slider-target-line" id="target-line"></div>
            </div>
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isGameActive = false;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        let chargeSpeed = 2; // Pace at which the power increases
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for perfect throw

        let misses = 0;
        let isGameOver = false;

        // Three.js Variables
        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentTarget = null;
        let environmentGroup;

        // 3D Frisbee Variables
        let frisbeeMesh;
        let frisbeeActive = false;
        let frisbeeVelocity = new THREE.Vector3();
        let targetAim = null;

        // Camera Look / Drag Control Variables
        let isDraggingCamera = false;
        let pointerDownPos = { x: 0, y: 0 };
        let lastPointerPos = { x: 0, y: 0 };
        let cameraYaw = 0;
        let cameraPitch = 0;

        let isScanningMarker = false;

        async function startCameraFeed() {
            const video = document.getElementById('camera-feed');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.warn('Camera feed unavailable or permission denied:', err);
            }
        }

        async function startGame() {
            const button = document.getElementById('scan-btn');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                button.style.opacity = '0';
                button.style.pointerEvents = 'none';
            }, 100);

            await startCameraFeed();

            if (!renderer) {
                initThreeJS();
            }

            isGameActive = true;
            startScanningForReticle();
        }

        function initThreeJS() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = null; // Keep transparent so live camera feed shows through

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
            camera.position.set(0, 1.4, 0); // Eye level
            camera.rotation.order = 'YXZ';

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight.position.set(2, 5, 3);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const rimLight = new THREE.PointLight(0x8B5CF6, 1.2, 10);
            rimLight.position.set(-2, 2.5, -1);
            scene.add(rimLight);

            environmentGroup = new THREE.Group();
            scene.add(environmentGroup);

            // Build Reusable 10x10 Target Template
            buildTargetTemplate();

            // Build High-Detail Blender-Style 3D Frisbee
            buildFrisbeeMesh();

            // Handle Window Resize
            window.addEventListener('resize', onWindowResize);

            // Start Render Loop
            requestAnimationFrame(animate);
        }

        function buildArenaSurfaces() {
            environmentGroup = new THREE.Group();
            scene.add(environmentGroup);

            // Invisible Curved Surface at ~2.8 feet (0.85 meters) from camera for raycast target placement
            const wallGeo = new THREE.CylinderGeometry(0.86, 0.86, 2.4, 32, 1, true, Math.PI * 0.65, Math.PI * 0.7);
            const wallMat = new THREE.MeshBasicMaterial({
                transparent: true,
                opacity: 0,
                depthWrite: false,
                side: THREE.BackSide
            });
            const arenaWall = new THREE.Mesh(wallGeo, wallMat);
            arenaWall.position.set(0, 1.4, 0);
            environmentGroup.add(arenaWall);
            arenaSurfaces.push(arenaWall);
        }

        function buildTargetTemplate() {
            targetTemplateMesh = new THREE.Group();

            // Consistent 10x10 scale (10 inches / ~0.254 meters total outer diameter -> outer radius 0.127m)
            const ringDefs = [
                { inner: 0.088, outer: 0.127, color: 0xFF3333, name: 'outer' },  // Outer Red Ring
                { inner: 0.048, outer: 0.088, color: 0xFFFFFF, name: 'middle' }, // Middle White Ring
                { inner: 0.001, outer: 0.048, color: 0xFF3333, name: 'inner' }   // Inner Bullseye
            ];

            ringDefs.forEach((def) => {
                const ringGeo = new THREE.RingGeometry(def.inner, def.outer, 48);
                const ringMat = new THREE.MeshStandardMaterial({
                    color: def.color,
                    roughness: 0.35,
                    metalness: 0.1,
                    side: THREE.DoubleSide
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.name = def.name;
                ringMesh.castShadow = true;
                targetTemplateMesh.add(ringMesh);
            });

            // Subtle dark border ring for crisp cartoon outline aesthetic
            const borderGeo = new THREE.RingGeometry(0.127, 0.133, 48);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
            const borderMesh = new THREE.Mesh(borderGeo, borderMat);
            borderMesh.name = 'border';
            scene.add(borderMesh);
        }

        function buildFrisbeeMesh() {
            // LatheGeometry profile mimicking a Blender-modeled aerodynamic disc
            const points = [
                new THREE.Vector2(0.000, 0.014),
                new THREE.Vector2(0.035, 0.014),
                new THREE.Vector2(0.062, 0.011),
                new THREE.Vector2(0.075, 0.005),
                new THREE.Vector2(0.078, -0.004),
                new THREE.Vector2(0.072, -0.006),
                new THREE.Vector2(0.068, 0.004),
                new THREE.Vector2(0.055, 0.009),
                new THREE.Vector2(0.000, 0.010)
            ];

            const latheGeo = new THREE.LatheGeometry(points, 48);
            const frisbeeMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                roughness: 0.18,
                metalness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });

            frisbeeMesh = new THREE.Mesh(latheGeo, frisbeeMat);
            frisbeeMesh.castShadow = true;

            // Add aerodynamic flight rings on top of the disc
            const grooveGeo = new THREE.RingGeometry(0.045, 0.049, 48);
            const grooveMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, side: THREE.DoubleSide });
            const grooveMesh = new THREE.Mesh(grooveGeo, grooveMat);
            grooveMesh.rotation.x = -Math.PI / 2;
            grooveMesh.position.y = 0.0142;
            frisbeeMesh.add(grooveMesh);

            frisbeeMesh.visible = false;
            scene.add(frisbeeMesh);
        }

        function startScanningForReticle() {
            isScanningMarker = true;
            document.getElementById('top-banner').style.opacity = '0';
            document.getElementById('bottom-slider').style.opacity = '0';
            document.getElementById('scanner-ui').style.display = 'flex';

            // Simulate the time it takes to detect "Scannable_Reticle.png"
            setTimeout(() => {
                if (!isGameActive || isGameOver) return;
                
                document.getElementById('scanner-ui').style.display = 'none';
                document.getElementById('top-banner').style.opacity = '1';
                document.getElementById('bottom-slider').style.opacity = '1';
                isScanningMarker = false;
                
                spawnTargetOnReticle();
                randomizeTargetLine();
            }, 3000); // 3 second scan delay
        }

        function spawnTargetOnReticle() {
            if (!targetTemplateMesh || activeTargets.length >= 1) return;

            // Spawn directly where the camera is currently looking to simulate locking onto the scanned reticle
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const scanPos = camera.position.clone().addScaledVector(forward, 0.9144); // Exactly 3 feet away
            
            const targetClone = targetTemplateMesh.clone();
            targetClone.position.copy(scanPos);
            targetClone.lookAt(camera.position);

            const outer = targetClone.getObjectByName('outer');
            const middle = targetClone.getObjectByName('middle');
            const inner = targetClone.getObjectByName('inner');
            targetClone.userData.rings = [outer, middle, inner].filter(Boolean);

            scene.add(targetClone);
            activeTargets.push(targetClone);
            currentTarget = targetClone;
        }

        function startChargingFrisbee() {
            if (isGameOver || !isGameActive || frisbeeActive || isScanningMarker) return;
            isCharging = true;
            currentPower = 0;
            powerDirection = 1;
        }

        function releaseFrisbee() {
            if (!isGameActive || isGameOver || frisbeeActive || isScanningMarker) return;

            const diff = Math.abs(currentPower - targetPower);
            const isHit = diff <= tolerance;

            // Spawn 3D frisbee just below camera view
            const camPos = camera.position.clone();
            const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();

            frisbeeMesh.position.copy(camPos)
                .addScaledVector(camDir, 0.15)
                .addScaledVector(upVec, -0.10);
            frisbeeMesh.quaternion.copy(camera.quaternion);
            frisbeeMesh.visible = true;
            frisbeeActive = true;

            if (isHit && currentTarget) {
                // Aim directly at the active target's 3D center
                targetAim = currentTarget;
                const dirToTarget = new THREE.Vector3().subVectors(currentTarget.position, frisbeeMesh.position).normalize();
                frisbeeVelocity.copy(dirToTarget).multiplyScalar(2.8);
            } else {
                // Miss trajectory based on how much player over/under-charged
                targetAim = null;
                const powerDelta = (currentPower - targetPower) / 100;
                const missDir = camDir.clone();
                missDir.y += powerDelta * 0.65;
                missDir.x += (Math.random() - 0.5) * 0.25;
                missDir.normalize();
                frisbeeVelocity.copy(missDir).multiplyScalar(2.6);
            }
        }

        function handleFrisbeeHit(targetObj) {
            if (!targetObj || !targetObj.userData.rings) return;

            // Slide "+ 1 Point" 2 pixels above the hit target
            showScorePopupAboveTarget(targetObj);

            // Remove outermost remaining ring
            const removedRing = targetObj.userData.rings.shift();
            if (removedRing) {
                targetObj.remove(removedRing);
            }

            // If all 3 rings are removed, destroy target & respawn a new one
            if (targetObj.userData.rings.length === 0) {
                scene.remove(targetObj);
                activeTargets = activeTargets.filter(t => t !== targetObj);
                if (currentTarget === targetObj) {
                    currentTarget = null;
                }
                // Target fully destroyed, scan for reticle again
                startScanningForReticle();
            } else {
                randomizeTargetLine();
            }
        }

        function handleFrisbeeMiss() {
            misses++;
            if (misses >= 20) {
                isGameOver = true;
                isCharging = false;
                document.getElementById('continue-overlay').style.display = 'flex';
            }
        }

        function continueGame() {
            misses = 0;
            isGameOver = false;
            document.getElementById('continue-overlay').style.display = 'none';
            updatePowerMeter(0);
        }

        function showScorePopupAboveTarget(targetObj) {
            const popup = document.getElementById('score-popup');
            const worldPos = new THREE.Vector3();
            targetObj.getWorldPosition(worldPos);
            worldPos.project(camera);

            const screenX = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = (-(worldPos.y * 0.5) + 0.5) * window.innerHeight;

            popup.style.transition = 'none';
            popup.style.left = `${screenX}px`;
            popup.style.top = `${screenY}px`;
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, -50%)';
            popup.style.display = 'block';

            // Force reflow then slide 2 pixels upwards
            void popup.offsetWidth;
            popup.style.transition = 'transform 0.45s ease-out, opacity 0.45s ease-out';
            popup.style.transform = 'translate(-50%, calc(-50% - 2px))';
            popup.style.opacity = '0';

            setTimeout(() => {
                popup.style.display = 'none';
            }, 460);
        }

        function randomizeTargetLine() {
            targetPower = Math.floor(Math.random() * 65) + 20; // Between 20% and 85%
            document.getElementById('target-line').style.left = `${targetPower}%`;
        }

        function updatePowerMeter(power) {
            const clamped = Math.max(0, Math.min(100, power));
            document.querySelector('.slider-track-left').style.width = `${clamped}%`;
            document.querySelector('.slider-track-right').style.width = `${100 - clamped}%`;
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Three.js Animation Loop
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Update Power Meter Charging
            if (isCharging && !isGameOver) {
                currentPower += chargeSpeed * powerDirection;
                if (currentPower >= 100) {
                    currentPower = 100;
                    powerDirection = -1;
                } else if (currentPower <= 0) {
                    currentPower = 0;
                    powerDirection = 1;
                }
                updatePowerMeter(currentPower);
            }

            // Update 3D Frisbee Flight & Collision Detection
            if (frisbeeActive && frisbeeMesh) {
                frisbeeMesh.position.addScaledVector(frisbeeVelocity, dt);
                frisbeeMesh.rotation.y += 18 * dt; // Aerodynamic spin

                // Check 3D collider intersection against active targets
                let collidedTarget = null;
                const frisbeeRadius = 0.078;

                for (const target of activeTargets) {
                    const activeRings = target.userData.rings || [];
                    const currentOuterRadius = activeRings.length === 3 ? 0.127 :
                                               activeRings.length === 2 ? 0.088 : 0.048;

                    const dist = frisbeeMesh.position.distanceTo(target.position);
                    if (dist <= (frisbeeRadius + currentOuterRadius)) {
                        collidedTarget = target;
                        break;
                    }
                }

                if (collidedTarget) {
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleFrisbeeHit(collidedTarget);
                    updatePowerMeter(0);
                } else if (frisbeeMesh.position.distanceTo(camera.position) > 1.8) {
                    // Missed target and flew past arena wall
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleFrisbeeMiss();
                    updatePowerMeter(0);
                }
            }

            renderer.render(scene, camera);
        }

        // Pointer / Touch Input: Tap & Hold to Charge/Throw, Drag to Look Around
        function handlePointerDown(e) {
            if (isGameOver || !isGameActive || (e.target && e.target.closest('.interactive-element'))) return;

            isDraggingCamera = true;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            lastPointerPos = { x: e.clientX, y: e.clientY };

            if (!isCharging && !frisbeeActive) {
                startChargingFrisbee();
            }
        }

        function handlePointerMove(e) {
            if (!isDraggingCamera || !camera) return;

            const dx = e.clientX - lastPointerPos.x;
            const dy = e.clientY - lastPointerPos.y;
            lastPointerPos = { x: e.clientX, y: e.clientY };

            // Rotate camera smoothly within arena bounds
            cameraYaw -= dx * 0.0035;
            cameraPitch -= dy * 0.0035;

            cameraYaw = Math.max(-0.85, Math.min(0.85, cameraYaw));
            cameraPitch = Math.max(-0.45, Math.min(0.45, cameraPitch));

            camera.rotation.y = cameraYaw;
            camera.rotation.x = cameraPitch;
        }

        function handlePointerUp() {
            isDraggingCamera = false;
            if (isCharging) {
                isCharging = false;
                releaseFrisbee();
            }
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
    </script>
</body>
</html>
