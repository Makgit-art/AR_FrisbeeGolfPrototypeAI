<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hole in the Wall - 3D Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Shrikhand&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Shrikhand', Georgia, serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Live Camera Video Feed */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Layer Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 60px 20px;
            pointer-events: none; /* Let touches pass through to Three.js scene */
        }

        /* Make specific UI elements interactive */
        .interactive-element {
            pointer-events: auto;
        }

        /* Custom Text Outline Utility */
        .text-outline-wrapper {
            position: relative;
            display: inline-block;
        }

        .text-outline-bg {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        .text-outline-fg {
            position: relative;
            z-index: 2;
            color: white;
        }

        /* Top Banner Styles */
        .banner-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            padding: 8px 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            position: relative;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .banner-text-bg {
            -webkit-text-stroke: 10px #8B5CF6; /* Purple outline */
            color: #8B5CF6;
        }

        /* Center Button Styles */
        .scan-button {
            background: linear-gradient(135deg, #74ED63 0%, #C4D942 100%);
            border: 4px solid black;
            border-radius: 20px;
            padding: 12px 40px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.5s ease-in-out, transform 0.1s;
        }
        
        .scan-button:active {
            transform: scale(0.95);
        }

        .scan-text-bg {
            -webkit-text-stroke: 10px #246B3E; /* Dark green outline */
            color: #246B3E;
        }

        /* Bottom Slider Styles */
        .slider-container {
            background-color: #B0B0B0;
            border: 4px solid black;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: relative;
            pointer-events: auto;
            z-index: 100;
            transition: opacity 0.4s ease;
        }

        .slider-end-mark {
            width: 4px;
            height: 32px;
            background-color: black;
        }

        .slider-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .slider-track-left {
            height: 8px;
            width: 0%;
            background-color: #D282FF;
            border-top: 2px solid black;
            border-bottom: 2px solid black;
        }

        .slider-track-right {
            height: 10px;
            width: 100%;
            background-color: black;
        }

        .slider-target-line {
            width: 6px;
            height: 40px;
            background-color: #74ED63;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Live Camera Feed Background -->
    <video id="camera-feed" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="three-container" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">

        <!-- Top Banner -->
        <div id="top-banner" class="banner-container interactive-element" style="opacity: 0;">
            <div class="text-outline-wrapper text-4xl sm:text-5xl md:text-6xl italic tracking-wide">
                <span class="text-outline-bg banner-text-bg" aria-hidden="true">Hole in the Wall</span>
                <span class="text-outline-fg">Hole in the Wall</span>
            </div>
        </div>

        <!-- Center Start Button -->
        <button id="scan-btn" class="scan-button interactive-element" onclick="startGame()">
            <div class="text-outline-wrapper text-4xl md:text-5xl italic tracking-wider">
                <span class="text-outline-bg scan-text-bg" aria-hidden="true">Start Game</span>
                <span class="text-outline-fg">Start Game</span>
            </div>
        </button>

        <!-- Score Popup -->
        <div id="score-popup" style="display: none; position: absolute; color: #74ED63; font-family: 'Shrikhand', Georgia, serif; font-size: 2rem; font-weight: bold; -webkit-text-stroke: 1px black; z-index: 150; pointer-events: none; transition: transform 0.5s ease-out, opacity 0.5s ease-out; transform: translate(-50%, -50%);">+ 1 Point</div>

        <!-- Continue Overlay -->
        <div id="continue-overlay" style="display: none; position: absolute; top: 0; left: 0; height: 100%; width: 100%; background-color: rgba(0,0,0,0.8); z-index: 200; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;">
            <div class="text-white text-4xl mb-6 tracking-wider" style="-webkit-text-stroke: 2px black;">20 Misses!</div>
            <button onclick="continueGame()" class="scan-button interactive-element">
                <div class="text-outline-wrapper text-3xl italic tracking-wider">
                    <span class="text-outline-bg scan-text-bg" aria-hidden="true">Continue?</span>
                    <span class="text-outline-fg">Continue?</span>
                </div>
            </button>
        </div>

        <!-- Simulated Image Scanner UI -->
        <div id="scanner-ui" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 120; flex-direction: column; justify-content: center; align-items: center; pointer-events: none;">
            <div style="border: 4px dashed #74ED63; width: 212px; height: 275px; border-radius: 16px; position: relative; box-shadow: 0 0 20px rgba(116, 237, 99, 0.3); animation: pulse 2s infinite;">
                <div style="position: absolute; top: -40px; left: 0; width: 100%; text-align: center; color: #74ED63; font-weight: bold; font-family: sans-serif; font-size: 1.2rem; text-shadow: 2px 2px 4px black; -webkit-text-stroke: 1px black;">SCANNING 8.5" x 11"...</div>
                <div style="position: absolute; bottom: -40px; left: 0; width: 100%; text-align: center; color: white; font-family: sans-serif; font-size: 0.9rem; text-shadow: 1px 1px 2px black;">Align scannable image in frame</div>
            </div>
            
            <!-- Reference Image for the User -->
            <div style="position: absolute; bottom: 100px; right: 20px; display: flex; flex-direction: column; align-items: center;">
                <span style="color: white; font-family: sans-serif; font-size: 0.8rem; text-shadow: 1px 1px 2px black; margin-bottom: 5px;">Target Marker</span>
                <img src="Scannable_Reticle.png" alt="Reticle Reference" style="width: 80px; height: 80px; border: 2px solid white; border-radius: 10px; background: rgba(0,0,0,0.5); object-fit: contain;">
            </div>
        </div>

        <!-- GLB File Loader Control -->
        <div class="interactive-element" style="position: absolute; top: 14px; right: 14px; z-index: 160;">
            <label for="glb-file-input" style="display: inline-block; background: rgba(0,0,0,0.75); color: #74ED63; border: 2px solid #74ED63; border-radius: 12px; padding: 6px 12px; font-family: sans-serif; font-size: 0.8rem; font-weight: bold; cursor: pointer;">
                Load .GLB
            </label>
            <input id="glb-file-input" type="file" accept=".glb,.gltf" style="display: none;" onchange="handleGlbUpload(event)">
        </div>

        <style>
            @keyframes pulse {
                0% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
                50% { border-color: rgba(116, 237, 99, 0.3); box-shadow: 0 0 10px rgba(116, 237, 99, 0.1); }
                100% { border-color: rgba(116, 237, 99, 1); box-shadow: 0 0 20px rgba(116, 237, 99, 0.5); }
            }
        </style>

        <!-- Bottom Slider -->
        <div id="bottom-slider" class="slider-container interactive-element" style="opacity: 0;">
            <div class="slider-end-mark"></div>
            <div class="slider-track-container mx-1">
                <div class="slider-track-left"></div>
                <div class="slider-track-right"></div>
                <div class="slider-target-line" id="target-line"></div>
            </div>
            <div class="slider-end-mark"></div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        // Game State Variables
        let isGameActive = false;
        let isCharging = false;
        let currentPower = 0;
        let powerDirection = 1;
        let chargeSpeed = 2; // Pace at which the power increases
        let targetPower = 50;
        const tolerance = 6; // +/- 6% for perfect throw

        let misses = 0;
        let isGameOver = false;

        // Three.js Variables
        let scene, camera, renderer, targetTemplateMesh;
        let activeTargets = [];
        let currentTarget = null;
        let environmentGroup;

        // Stencil Portal & GLB Model Variables (8.5" x 11" converted to meters)
        const PORTAL_WIDTH_M = 8.5 * 0.0254;   // 0.2159 meters
        const PORTAL_HEIGHT_M = 11.0 * 0.0254; // 0.2794 meters
        const STENCIL_REF = 1;
        let gltfLoader = null;
        let loadedGlbModel = null;

        // 3D Frisbee Variables
        let frisbeeMesh;
        let frisbeeActive = false;
        let frisbeeVelocity = new THREE.Vector3();
        let targetAim = null;

        // Camera Look / Drag Control Variables
        let isDraggingCamera = false;
        let pointerDownPos = { x: 0, y: 0 };
        let lastPointerPos = { x: 0, y: 0 };
        let cameraYaw = 0;
        let cameraPitch = 0;

        let isScanningMarker = false;
        let controls; // Visual-Inertial Tracker

        async function startCameraFeed() {
            const video = document.getElementById('camera-feed');
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                console.warn('Camera feed unavailable or permission denied:', err);
            }
        }

        async function startGame() {
            const button = document.getElementById('scan-btn');
            button.style.transform = 'scale(0.9)';
            setTimeout(() => {
                button.style.transform = 'scale(1)';
                button.style.opacity = '0';
                button.style.pointerEvents = 'none';
            }, 100);

            // Request Device Orientation Permission for Visual-Inertial Tracking (iOS 13+)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        console.warn('Device orientation permission not granted for visual-inertial tracking.');
                    }
                } catch (error) {
                    console.error('Error requesting device orientation permission:', error);
                }
            }

            await startCameraFeed();

            if (!renderer) {
                initThreeJS();
            }

            isGameActive = true;
            startScanningForReticle();
        }

        function initThreeJS() {
            const container = document.getElementById('three-container');
            scene = new THREE.Scene();
            scene.background = null; // Keep transparent so live camera feed shows through

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 50);
            camera.position.set(0, 1.4, 0); // Eye level
            camera.rotation.order = 'YXZ';

            // Enable stencil buffer for 8.5" x 11" portal masking
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
            renderer.setClearColor(0x000000, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight.position.set(2, 5, 3);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const rimLight = new THREE.PointLight(0x8B5CF6, 1.2, 10);
            rimLight.position.set(-2, 2.5, -1);
            scene.add(rimLight);

            environmentGroup = new THREE.Group();
            scene.add(environmentGroup);

            // Initialize Device Orientation Tracking for AR feel
            controls = new THREE.DeviceOrientationControls(camera);

            // Initialize GLTF/GLB Loader and build 8.5" x 11" Stencil Portal Template
            gltfLoader = new THREE.GLTFLoader();
            buildTargetTemplate();
            tryLoadDefaultGlb();

            // Build High-Detail Blender-Style 3D Frisbee
            buildFrisbeeMesh();

            window.addEventListener('resize', onWindowResize);
            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        function buildTargetTemplate() {
            targetTemplateMesh = new THREE.Group();

            // 1. Custom Stencil Shader Material for the 8.5" x 11" mask area on the scannable image
            const stencilMaskMaterial = new THREE.ShaderMaterial({
                vertexShader: `
                    void main() {
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    void main() {
                        gl_FragColor = vec4(1.0);
                    }
                `,
                colorWrite: false,
                depthWrite: false,
                side: THREE.DoubleSide,
                stencilWrite: true,
                stencilRef: STENCIL_REF,
                stencilFunc: THREE.AlwaysStencilFunc,
                stencilFail: THREE.KeepStencilOp,
                stencilZFail: THREE.KeepStencilOp,
                stencilZPass: THREE.ReplaceStencilOp
            });

            // 8.5" x 11" Stencil Mask Plane
            const maskGeo = new THREE.PlaneGeometry(PORTAL_WIDTH_M, PORTAL_HEIGHT_M);
            const maskMesh = new THREE.Mesh(maskGeo, stencilMaskMaterial);
            maskMesh.name = 'stencil-mask';
            maskMesh.renderOrder = 1;
            targetTemplateMesh.add(maskMesh);

            // 2. Crisp 8.5" x 11" Portal Frame Outline (shows masked boundary on scannable image)
            const frameGeo = new THREE.EdgesGeometry(maskGeo);
            const frameMat = new THREE.LineBasicMaterial({ color: 0x74ED63 });
            const frameOutline = new THREE.LineSegments(frameGeo, frameMat);
            frameOutline.name = 'portal-frame';
            frameOutline.renderOrder = 3;
            targetTemplateMesh.add(frameOutline);

            // 3. Container for the masked GLB scene recessed behind the 8.5" x 11" window
            const glbContainer = new THREE.Group();
            glbContainer.name = 'glb-container';
            glbContainer.position.set(0, -PORTAL_HEIGHT_M * 0.25, -0.14);

            const contentModel = loadedGlbModel ? loadedGlbModel.clone() : buildGlbFallbackScene();
            applyStencilMaskToModel(contentModel);
            glbContainer.add(contentModel);
            targetTemplateMesh.add(glbContainer);
        }

        function applyStencilMaskToModel(rootObj) {
            rootObj.traverse((child) => {
                if (child.isMesh && child.material) {
                    const materials = Array.isArray(child.material) ? child.material : [child.material];
                    const clonedMats = materials.map((mat) => {
                        const m = mat.clone();
                        m.stencilWrite = true;
                        m.stencilRef = STENCIL_REF;
                        m.stencilFunc = THREE.EqualStencilFunc;
                        m.stencilFail = THREE.KeepStencilOp;
                        m.stencilZFail = THREE.KeepStencilOp;
                        m.stencilZPass = THREE.KeepStencilOp;
                        return m;
                    });
                    child.material = Array.isArray(child.material) ? clonedMats : clonedMats[0];
                    child.renderOrder = 2;
                }
            });
        }

        function normalizeGlbToPortal(model) {
            // Auto-scale and center the imported GLB so it fits cleanly inside the 8.5" x 11" stencil window
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const targetSize = Math.min(PORTAL_WIDTH_M, PORTAL_HEIGHT_M) * 0.85;
            const scaleFactor = targetSize / maxDim;

            const wrapper = new THREE.Group();
            model.position.sub(center);
            model.scale.multiplyScalar(scaleFactor);
            wrapper.add(model);
            return wrapper;
        }

        function buildGlbFallbackScene() {
            // Procedural fallback matching the GLB JSON nodes: lampPost, Garbage, Leaf-Card, grass, pathway
            const diorama = new THREE.Group();
            diorama.name = 'glb-fallback-diorama';

            // Grass base
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x2d6a36, roughness: 0.9, side: THREE.DoubleSide });
            const grass = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32), grassMat);
            grass.rotation.x = -Math.PI / 2;
            diorama.add(grass);

            // Pathway (from GLB pathway.Materia;)
            const pathMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.128, 0.103, 0.112), roughness: 0.81, metalness: 0 });
            const pathway = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.008, 0.30), pathMat);
            pathway.position.set(0, 0.004, 0);
            diorama.add(pathway);

            // Lamp Post (from GLB lamp material)
            const lampMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.03, 0.005, 0.005), roughness: 0.27, metalness: 0.09 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.009, 0.16, 12), lampMat);
            pole.position.set(0.055, 0.08, -0.02);
            diorama.add(pole);

            const lampHead = new THREE.Mesh(new THREE.SphereGeometry(0.016, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfff3b0, emissive: 0xffd166, emissiveIntensity: 0.8 }));
            lampHead.position.set(0.055, 0.165, -0.02);
            diorama.add(lampHead);

            // Garbage Bin (from GLB garbage+Material)
            const garbageMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.008, 0.04, 0.014), roughness: 0.57, metalness: 0.41 });
            const garbage = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.015, 0.042, 16), garbageMat);
            garbage.position.set(0.032, 0.021, -0.015);
            diorama.add(garbage);

            // Leaf Card accent
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.7, side: THREE.DoubleSide });
            const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.035, 0.025), leafMat);
            leaf.position.set(-0.04, 0.02, -0.05);
            leaf.rotation.set(-0.4, 0.4, 0.2);
            diorama.add(leaf);

            return diorama;
        }

        function swapGlbIntoActiveTargets(glbScene) {
            loadedGlbModel = normalizeGlbToPortal(glbScene);
            buildTargetTemplate();

            // Hot-swap into any currently spawned portal target
            activeTargets.forEach((target) => {
                const container = target.getObjectByName('glb-container');
                if (container) {
                    while (container.children.length > 0) {
                        container.remove(container.children[0]);
                    }
                    const nextModel = loadedGlbModel.clone();
                    applyStencilMaskToModel(nextModel);
                    container.add(nextModel);
                }
            });
        }

        function tryLoadDefaultGlb() {
            if (!gltfLoader) return;
            gltfLoader.load(
                'target.glb',
                (gltf) => swapGlbIntoActiveTargets(gltf.scene),
                undefined,
                () => {
                    // Silently keep fallback diorama until user uploads their .glb via "Load .GLB"
                }
            );
        }

        function handleGlbUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                if (!gltfLoader) {
                    gltfLoader = new THREE.GLTFLoader();
                }
                gltfLoader.parse(
                    e.target.result,
                    '',
                    (gltf) => swapGlbIntoActiveTargets(gltf.scene),
                    (err) => console.error('Failed to parse GLB file:', err)
                );
            };
            reader.readAsArrayBuffer(file);
        }

        function buildFrisbeeMesh() {
            // LatheGeometry profile mimicking a Blender-modeled aerodynamic disc
            const points = [
                new THREE.Vector2(0.000, 0.014),
                new THREE.Vector2(0.035, 0.014),
                new THREE.Vector2(0.062, 0.011),
                new THREE.Vector2(0.075, 0.005),
                new THREE.Vector2(0.078, -0.004),
                new THREE.Vector2(0.072, -0.006),
                new THREE.Vector2(0.068, 0.004),
                new THREE.Vector2(0.055, 0.009),
                new THREE.Vector2(0.000, 0.010)
            ];

            const latheGeo = new THREE.LatheGeometry(points, 48);
            const frisbeeMat = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                roughness: 0.18,
                metalness: 0.05,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                side: THREE.DoubleSide
            });

            frisbeeMesh = new THREE.Mesh(latheGeo, frisbeeMat);
            frisbeeMesh.castShadow = true;

            // Add aerodynamic flight rings on top of the disc
            const grooveGeo = new THREE.RingGeometry(0.045, 0.049, 48);
            const grooveMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, side: THREE.DoubleSide });
            const grooveMesh = new THREE.Mesh(grooveGeo, grooveMat);
            grooveMesh.rotation.x = -Math.PI / 2;
            grooveMesh.position.y = 0.0142;
            frisbeeMesh.add(grooveMesh);

            frisbeeMesh.visible = false;
            scene.add(frisbeeMesh);
        }

        function startScanningForReticle() {
            isScanningMarker = true;
            document.getElementById('top-banner').style.opacity = '0';
            document.getElementById('bottom-slider').style.opacity = '0';
            document.getElementById('scanner-ui').style.display = 'flex';

            // Simulate the time it takes to detect "Scannable_Reticle.png"
            setTimeout(() => {
                if (!isGameActive || isGameOver) return;
                
                document.getElementById('scanner-ui').style.display = 'none';
                document.getElementById('top-banner').style.opacity = '1';
                document.getElementById('bottom-slider').style.opacity = '1';
                isScanningMarker = false;
                
                spawnTargetOnReticle();
                randomizeTargetLine();
            }, 3000); // 3 second scan delay
        }

        function spawnTargetOnReticle() {
            if (!targetTemplateMesh || activeTargets.length >= 1) return;

            // Spawn directly where the camera is currently looking to simulate locking onto the scanned 8.5" x 11" image
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const scanPos = camera.position.clone().addScaledVector(forward, 0.9144); // Exactly 3 feet away
            
            const targetClone = targetTemplateMesh.clone();
            targetClone.position.copy(scanPos);
            targetClone.lookAt(camera.position);

            // Re-apply stencil test settings on cloned GLB materials
            const glbContainer = targetClone.getObjectByName('glb-container');
            if (glbContainer) {
                applyStencilMaskToModel(glbContainer);
            }

            targetClone.userData.hitsRemaining = 3;

            scene.add(targetClone);
            activeTargets.push(targetClone);
            currentTarget = targetClone;
        }

        function startChargingFrisbee() {
            if (isGameOver || !isGameActive || frisbeeActive || isScanningMarker) return;
            isCharging = true;
            currentPower = 0;
            powerDirection = 1;
        }

        function releaseFrisbee() {
            if (!isGameActive || isGameOver || frisbeeActive || isScanningMarker) return;

            const diff = Math.abs(currentPower - targetPower);
            const isHit = diff <= tolerance;

            // Spawn 3D frisbee just below camera view
            const camPos = camera.position.clone();
            const camDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            const upVec = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();

            frisbeeMesh.position.copy(camPos)
                .addScaledVector(camDir, 0.15)
                .addScaledVector(upVec, -0.10);
            frisbeeMesh.quaternion.copy(camera.quaternion);
            frisbeeMesh.visible = true;
            frisbeeActive = true;

            if (isHit && currentTarget) {
                // Aim directly at the active target's 3D center
                targetAim = currentTarget;
                const dirToTarget = new THREE.Vector3().subVectors(currentTarget.position, frisbeeMesh.position).normalize();
                frisbeeVelocity.copy(dirToTarget).multiplyScalar(2.8);
            } else {
                // Miss trajectory based on how much player over/under-charged
                targetAim = null;
                const powerDelta = (currentPower - targetPower) / 100;
                const missDir = camDir.clone();
                missDir.y += powerDelta * 0.65;
                missDir.x += (Math.random() - 0.5) * 0.25;
                missDir.normalize();
                frisbeeVelocity.copy(missDir).multiplyScalar(2.6);
            }
        }

        function handleFrisbeeHit(targetObj) {
            if (!targetObj) return;

            // Slide "+ 1 Point" 2 pixels above the hit target
            showScorePopupAboveTarget(targetObj);

            targetObj.userData.hitsRemaining = (targetObj.userData.hitsRemaining || 1) - 1;

            // Subtle scale pulse feedback on the masked GLB scene
            const glbContainer = targetObj.getObjectByName('glb-container');
            if (glbContainer) {
                glbContainer.scale.set(1.12, 1.12, 1.12);
                setTimeout(() => {
                    if (glbContainer) glbContainer.scale.set(1, 1, 1);
                }, 180);
            }

            // After 3 hits, clear target & rescan for the scannable image
            if (targetObj.userData.hitsRemaining <= 0) {
                scene.remove(targetObj);
                activeTargets = activeTargets.filter(t => t !== targetObj);
                if (currentTarget === targetObj) {
                    currentTarget = null;
                }
                startScanningForReticle();
            } else {
                randomizeTargetLine();
            }
        }

        function handleFrisbeeMiss() {
            misses++;
            if (misses >= 20) {
                isGameOver = true;
                isCharging = false;
                document.getElementById('continue-overlay').style.display = 'flex';
            }
        }

        function continueGame() {
            misses = 0;
            isGameOver = false;
            document.getElementById('continue-overlay').style.display = 'none';
            updatePowerMeter(0);
        }

        function showScorePopupAboveTarget(targetObj) {
            const popup = document.getElementById('score-popup');
            const worldPos = new THREE.Vector3();
            targetObj.getWorldPosition(worldPos);
            worldPos.project(camera);

            const screenX = (worldPos.x * 0.5 + 0.5) * window.innerWidth;
            const screenY = (-(worldPos.y * 0.5) + 0.5) * window.innerHeight;

            popup.style.transition = 'none';
            popup.style.left = `${screenX}px`;
            popup.style.top = `${screenY}px`;
            popup.style.opacity = '1';
            popup.style.transform = 'translate(-50%, -50%)';
            popup.style.display = 'block';

            // Force reflow then slide 2 pixels upwards
            void popup.offsetWidth;
            popup.style.transition = 'transform 0.45s ease-out, opacity 0.45s ease-out';
            popup.style.transform = 'translate(-50%, calc(-50% - 2px))';
            popup.style.opacity = '0';

            setTimeout(() => {
                popup.style.display = 'none';
            }, 460);
        }

        function randomizeTargetLine() {
            targetPower = Math.floor(Math.random() * 65) + 20; // Between 20% and 85%
            document.getElementById('target-line').style.left = `${targetPower}%`;
        }

        function updatePowerMeter(power) {
            const clamped = Math.max(0, Math.min(100, power));
            document.querySelector('.slider-track-left').style.width = `${clamped}%`;
            document.querySelector('.slider-track-right').style.width = `${100 - clamped}%`;
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Three.js Animation Loop
        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // Update Power Meter Charging
            if (isCharging && !isGameOver) {
                currentPower += chargeSpeed * powerDirection;
                if (currentPower >= 100) {
                    currentPower = 100;
                    powerDirection = -1;
                } else if (currentPower <= 0) {
                    currentPower = 0;
                    powerDirection = 1;
                }
                updatePowerMeter(currentPower);
            }

            // Apply Visual-Inertial Tracking to Camera
            if (controls) {
                controls.update();
            }

            // Update 3D Frisbee Flight & Collision Detection
            if (frisbeeActive && frisbeeMesh) {
                frisbeeMesh.position.addScaledVector(frisbeeVelocity, dt);
                frisbeeMesh.rotation.y += 18 * dt; // Aerodynamic spin

                // Check 3D collider intersection against active 8.5" x 11" GLB portal targets
                let collidedTarget = null;
                const frisbeeRadius = 0.078;
                const portalHitRadius = Math.max(PORTAL_WIDTH_M, PORTAL_HEIGHT_M) * 0.5;

                for (const target of activeTargets) {
                    const dist = frisbeeMesh.position.distanceTo(target.position);
                    if (dist <= (frisbeeRadius + portalHitRadius)) {
                        collidedTarget = target;
                        break;
                    }
                }

                if (collidedTarget) {
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleFrisbeeHit(collidedTarget);
                    updatePowerMeter(0);
                } else if (frisbeeMesh.position.distanceTo(camera.position) > 1.8) {
                    // Missed target and flew past arena wall
                    frisbeeActive = false;
                    frisbeeMesh.visible = false;
                    handleFrisbeeMiss();
                    updatePowerMeter(0);
                }
            }

            renderer.render(scene, camera);
        }

        // Pointer / Touch Input: Tap & Hold to Charge/Throw, Drag to Look Around
        function handlePointerDown(e) {
            if (isGameOver || !isGameActive || (e.target && e.target.closest('.interactive-element'))) return;

            isDraggingCamera = true;
            pointerDownPos = { x: e.clientX, y: e.clientY };
            lastPointerPos = { x: e.clientX, y: e.clientY };

            if (!isCharging && !frisbeeActive) {
                startChargingFrisbee();
            }
        }

        function handlePointerMove(e) {
            if (!isDraggingCamera || !camera) return;

            const dx = e.clientX - lastPointerPos.x;
            const dy = e.clientY - lastPointerPos.y;
            lastPointerPos = { x: e.clientX, y: e.clientY };

            // Manual drag-look is overridden by the device's visual-inertial tracking, 
            // but we maintain the state for desktop testing fallback.
            cameraYaw -= dx * 0.0035;
            cameraPitch -= dy * 0.0035;

            cameraYaw = Math.max(-0.85, Math.min(0.85, cameraYaw));
            cameraPitch = Math.max(-0.45, Math.min(0.45, cameraPitch));
            
            if (!controls || !controls.deviceOrientation || controls.deviceOrientation.alpha === null) {
                camera.rotation.y = cameraYaw;
                camera.rotation.x = cameraPitch;
            }
        }

        function handlePointerUp() {
            isDraggingCamera = false;
            if (isCharging) {
                isCharging = false;
                releaseFrisbee();
            }
        }

        window.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
    </script>
</body>
</html>
